   # Gesamtleistung Wärmepumpe in W 
    - name: "WP Gesamtleistung" 
      unique_id: "wp_power_sum_w"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set p =
          (states('sensor.shelly_wp_innen_leistung') | float(0)) +
          (states('sensor.shelly_wp_aussen_leistung') | float(0))
        %}
        {% if p < 0  %} 0 {% else %} {{ p }} {% endif %}
     
    - name: "Sonnenaufgang Zeit"
      state: "{{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%H:%M') }}"

    - name: "Sonnenuntergang Zeit"
      state: "{{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%H:%M') }}"

    # PV-Überschuss nach Hausverbrauch und WP, OHNE Auto und OHNE Heizstab.
    # Ändert sich nicht, wenn Auto oder Heizstab schalten.
    - name: "PV Ueberschuss brutto"
      unique_id: pv_ueberschuss_brutto
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      availability: "{{ has_value('sensor.solax_energy_dashboard_solax_solar_power') }}"
      state: >
        {% set solar = states('sensor.solax_energy_dashboard_solax_solar_power') | float(0) %}
        {% set og = states('sensor.shellypro3em_og_leistung') | float(0) %}
        {% set eg = states('sensor.shellypro3em_eg_leistung') | float(0) %}
        {% set wp = states('sensor.wp_gesamtleistung') | float(0) %}
        {% set ac = 500 * (['climate.patrice', 'climate.schlafzimmer',
                            'climate.wohnzimmer', 'climate.buro']
                           | reject('is_state', 'off') | list | count) %}
        {{ (solar - og - eg - wp - ac) | round(0) }}
 
    # Wie oben, aber die WP wird wieder dazugerechnet: was stünde der WP zur Verfügung?
    # Dient als Trigger für den Boost.
    - name: "PV Ueberschuss vor WP"
      unique_id: pv_ueberschuss_vor_wp
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {{ (states('sensor.pv_ueberschuss_brutto') | float(0)
            + states('sensor.wp_gesamtleistung') | float(0)) | round(0) }}

    - name: "Heizstab Leistung"
      unique_id: heizstab_leistung
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {{ 3000 * ['switch.keller_shelly_heizstab_l1',
                   'switch.keller_shelly_heizstab_l2',
                   'switch.keller_shelly_heizstab_l3']
                  | select('is_state', 'on') | list | count }}
 
- binary_sensor:
    # WP zieht tatsächlich Strom (Shelly-Messung, nicht Vaillant-Werte)
    - name: "WP laeuft"
      unique_id: wp_laeuft
      device_class: running
      state: "{{ states('sensor.wp_gesamtleistung') | float(9999) > 300 }}"
      delay_on: "00:00:30"
      delay_off: "00:05:00"      # überbrückt Taktpausen der WP
 
    - name: "WP Boost Freigabe"
      unique_id: wp_boost_freigabe
      delay_on: "00:05:00"
      state: >
        {{ is_state('binary_sensor.wp_boost_ausstehend', 'on')
           and states('sensor.pv_ueberschuss_vor_wp') | float(0) > 4000
           and states('sensor.hausverbrauch_aktuell') | float(0) < 500 }}

    # Boost ist tagsüber möglich, der Sollwert steht aber noch auf 44 °C
    - name: "WP Boost ausstehend"
      unique_id: wp_boost_ausstehend
      state: >
        {{ 6 <= now().hour < 17
           and state_attr('water_heater.zuhause_domestic_hot_water_0', 'temperature') | float(55) < 54 }}
 
    # Auto-Startschwelle: 4,5 kW solange der Boost aussteht, sonst 2,5 kW
    - name: "EV Start Ueberschuss ok"
      unique_id: ev_start_ueberschuss_ok
      state: >
        {% set schwelle = 4500 if is_state('binary_sensor.wp_boost_ausstehend', 'on') else 2500 %}
        {{ states('sensor.pv_ueberschuss_brutto') | float(0) >= schwelle }}

    - name: "Heizstab Netzbezug hoch"
      unique_id: heizstab_netzbezug_hoch
      state: "{{ states('sensor.netzbezug_effektiv') | float(0) > 200 }}"
      delay_on: "00:00:30"
 

- trigger:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: state
      entity_id: input_datetime.rollladen_oeffnen_fruehestens
    - trigger: state
      entity_id: sun.sun
  sensor:
    - name: "rollladen_oeffnen_zeit"
      device_class: timestamp
      state: >
        {% set fixed_time = states('input_datetime.rollladen_oeffnen_fruehestens') %}
        {% set fixed = today_at(fixed_time) %}
        {% set sun_raw = state_attr('sun.sun', 'next_rising') %}
        {% if sun_raw %}
          {% set sun = as_datetime(sun_raw) | as_local %}
          {% if sun.date() != now().date() %}
            {% set sun = sun - timedelta(days=1) %}
          {% endif %}
          {{ [fixed, sun] | max }}
        {% else %}
          {{ fixed }}
        {% endif %}



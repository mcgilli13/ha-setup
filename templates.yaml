   # Gesamtleistung Wärmepumpe in W 
    - name: "WP Gesamtleistung" 
      unique_id: "wp_power_sum_w"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set p =
          (states('sensor.shelly_wp_innen_leistung') | float(0)) +
          (states('sensor.shelly_wp_aussen_leistung') | float(0))
        %}
        {% if p < 0  %} 0 {% else %} {{ p }} {% endif %}
     
    - name: "Sonnenaufgang Zeit"
      state: "{{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%H:%M') }}"

    - name: "Sonnenuntergang Zeit"
      state: "{{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%H:%M') }}"

    # PV-Überschuss nach Hausverbrauch und WP, OHNE Auto und OHNE Heizstab.
    # Ändert sich nicht, wenn Auto oder Heizstab schalten.
    - name: "PV Ueberschuss brutto"
      unique_id: pv_ueberschuss_brutto
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      availability: "{{ has_value('sensor.solax_energy_dashboard_solax_solar_power') }}"
      state: >
        {% set solar = states('sensor.solax_energy_dashboard_solax_solar_power') | float(0) %}
        {% set og = states('sensor.shellypro3em_og_leistung') | float(0) %}
        {% set eg = states('sensor.shellypro3em_eg_leistung') | float(0) %}
        {% set wp = states('sensor.wp_gesamtleistung') | float(0) %}
        {% set ac = 500 * (['climate.patrice', 'climate.schlafzimmer',
                            'climate.wohnzimmer', 'climate.buro']
                           | reject('is_state', 'off') | list | count) %}
        {{ (solar - og - eg - wp - ac) | round(0) }}
 
    # Wie oben, aber die WP wird wieder dazugerechnet: was stünde der WP zur Verfügung?
    # Dient als Trigger für den Boost.
    - name: "PV Ueberschuss vor WP"
      unique_id: pv_ueberschuss_vor_wp
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {{ (states('sensor.pv_ueberschuss_brutto') | float(0)
            + states('sensor.wp_gesamtleistung') | float(0)) | round(0) }}

    - name: "Heizstab Leistung"
      unique_id: heizstab_leistung
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {{ 3000 * ['switch.keller_shelly_heizstab_l1',
                   'switch.keller_shelly_heizstab_l2',
                   'switch.keller_shelly_heizstab_l3']
                  | select('is_state', 'on') | list | count }}

    - name: "Batterie SOC Mindest"
      unique_id: batterie_soc_mindest
      unit_of_measurement: "%"
      state: >
        {% set s = states('input_select.batterie_fahrplan') if has_value('input_select.batterie_fahrplan') else 'Auto' %}
        {# Auto: Oktober bis März = Winter. Monate hier anpassen #}
        {% set winter = (now().month in [10, 11, 12, 1, 2, 3]) if s == 'Auto' else s == 'Winter' %}
        {{ 60 if winter else 40 }}

    - name: "Batterie SOC Ziel"
      unique_id: batterie_soc_ziel
      unit_of_measurement: "%"
      state: >
        {% set s = states('input_select.batterie_fahrplan') if has_value('input_select.batterie_fahrplan') else 'Auto' %}
        {% set winter = (now().month in [10, 11, 12, 1, 2, 3]) if s == 'Auto' else s == 'Winter' %}
        {{ 80 if winter else 70 }}
 
- binary_sensor:
    # WP zieht tatsächlich Strom (Shelly-Messung, nicht Vaillant-Werte)
    - name: "WP laeuft"
      unique_id: wp_laeuft
      device_class: running
      state: "{{ states('sensor.wp_gesamtleistung') | float(9999) > 300 }}"
      delay_on: "00:00:30"
      delay_off: "00:05:00"      # überbrückt Taktpausen der WP
 
    - name: "WP Boost Freigabe"
      unique_id: wp_boost_freigabe
      delay_on: "00:05:00"
      state: >
        {{ is_state('binary_sensor.wp_boost_ausstehend', 'on')
           and states('sensor.pv_ueberschuss_vor_wp') | float(0) > 4000
           and states('sensor.hausverbrauch_aktuell') | float(0) < 500 }}

    # Boost ist tagsüber möglich, der Sollwert steht aber noch auf 44 °C
    - name: "WP Boost ausstehend"
      unique_id: wp_boost_ausstehend
      state: >
        {{ 6 <= now().hour < 17
           and state_attr('water_heater.zuhause_domestic_hot_water_0', 'temperature') | float(55) < 54 }}
 
    # Auto-Startschwelle: 4,5 kW solange der Boost aussteht, sonst 2,5 kW
    - name: "EV Start Ueberschuss ok"
      unique_id: ev_start_ueberschuss_ok
      state: >
        {% set schwelle = 4500 if is_state('binary_sensor.wp_boost_ausstehend', 'on') else 2500 %}
        {{ states('sensor.pv_ueberschuss_brutto') | float(0) >= schwelle }}

    - name: "Heizstab Netzbezug hoch"
      unique_id: heizstab_netzbezug_hoch
      state: "{{ states('sensor.netzbezug_effektiv') | float(0) > 200 }}"
      delay_on: "00:00:30"

    - name: "Waschmaschine laeuft"
      unique_id: waschmaschine_laeuft
      device_class: running
      state: "{{ states('sensor.smart_switch_23111643379067510d0248e1e9e22e55_power') | float(0) > 10 }}"
      delay_on: "00:01:00"    # kurze Spitzen im Leerlauf zählen nicht
      delay_off: "00:05:00"   # überbrückt Pausen im Programm (Einweichen, Warten) 

    - name: "Trockner laeuft"
      unique_id: trockner_laeuft
      device_class: running
      state: "{{ states('sensor.smart_switch_23111669739212510d0248e1e9e24660_power') | float(0) > 10 }}"
      delay_on: "00:01:00"    # ein einzelner Burst oder Leerlauf-Ausreißer schaltet nicht ein
      delay_off: "00:10:00"   # überbrückt die Trommel-Pausen im Nachlauf (längste gemessene: ca. 7 Min)
    
    - name: "Trockner heizt"
      unique_id: trockner_heizt
      device_class: running
      state: "{{ states('sensor.smart_switch_23111669739212510d0248e1e9e24660_power') | float(0) > 300 }}"
      delay_on: "00:02:00"
      delay_off: "00:03:00"      

    - name: "Batterie PV-Prognose reicht nicht"
      unique_id: batterie_pv_prognose_reicht_nicht
      state: >
        {% set soc = states('sensor.solax_inverter_battery_capacity') | float(-1) %}
        {% set rest = states('sensor.energy_production_today_remaining') | float(-1) %}
        {% set morgen = states('sensor.energy_production_tomorrow') | float(-1) %}
        {% set prognose = rest if now().hour < 16 else morgen %}
        {% if soc < 0 or prognose < 0 %}
          false
        {% else %}
          {% set ziel = states('sensor.batterie_soc_ziel') | float(80) %}
          {% set bedarf_batterie = (ziel - soc) / 100 * 20 %}  {# kWh bis zum Ziel, Batterie 20 kWh #}
          {% set bedarf_haus = 8 %}                          {# kWh Hausverbrauch Rest/Folgetag, geschätzt #}
          {{ prognose < (bedarf_batterie + bedarf_haus) * 1.3 }}  {# 30 % Sicherheit für Prognosefehler #}
        {% endif %}

    - name: "Batterie Preisfenster gut"
      unique_id: batterie_preisfenster_gut
      state: >
        {% set pl = 'sensor.batterie_ladeplan_start' %}
        {% set jetzt = now() %}
        {% set ns = namespace(im_plan=false) %}
        {% for s in state_attr(pl, 'segmente') or [] %}
          {% if as_datetime(s.start) <= jetzt + timedelta(minutes=1) and jetzt < as_datetime(s.ende) %}
            {% set ns.im_plan = true %}
          {% endif %}
        {% endfor %}
        {# Laufendes Netzladen nicht abbrechen, solange der Preis unter dem Break-even liegt und das Ziel nicht erreicht ist #}
        {% set laedt = is_state('select.batterie_modus', 'Netz laden') and is_state('input_boolean.batterie_netzladen_auto', 'on') %}
        {% set preis = states('sensor.tibber_strompreis') | float(9) * 100 %}
        {% set be = state_attr(pl, 'break_even_ct') | float(0) %}
        {% set soc = states('sensor.solax_inverter_battery_capacity') | float(100) %}
        {{ ns.im_plan or (laedt and preis <= be and soc < states('sensor.batterie_soc_ziel') | float(80)) }}

    # - name: "Batterie Preisfenster gut"
    #   unique_id: batterie_preisfenster_gut
    #   state: >
    #     {% set bp = 'binary_sensor.control_tibber_price_bestpreis_zeitraum' %}
    #     {% set im_fenster = is_state(bp, 'on') %}
    #     {% set fenster = state_attr(bp, 'price_mean') | float(999) %}
    #     {% set tagesmax = state_attr(bp, 'day_price_max') | float(0) %}
    #     {# Wirkungsgrad 0.9 und 5 ct Reserve, Preise in ct/kWh #}
    #     {{ im_fenster and (fenster / 0.9 + 5) < tagesmax }}

- trigger:
    - trigger: time_pattern
      minutes: "/5"
    - trigger: state
      entity_id: input_datetime.rollladen_oeffnen_fruehestens
    - trigger: state
      entity_id: sun.sun
  sensor:
    - name: "rollladen_oeffnen_zeit"
      device_class: timestamp
      state: >
        {% set fixed_time = states('input_datetime.rollladen_oeffnen_fruehestens') %}
        {% set fixed = today_at(fixed_time) %}
        {% set sun_raw = state_attr('sun.sun', 'next_rising') %}
        {% if sun_raw %}
          {% set sun = as_datetime(sun_raw) | as_local %}
          {% if sun.date() != now().date() %}
            {% set sun = sun - timedelta(days=1) %}
          {% endif %}
          {{ [fixed, sun] | max }}
        {% else %}
          {{ fixed }}
        {% endif %}


- triggers:
    - trigger: time_pattern
      minutes: "/30"
    - trigger: homeassistant
      event: start
  actions:
    - action: weather.get_forecasts
      target:
        entity_id: weather.forecast_home
      data:
        type: hourly
      response_variable: wetter
  sensor:
    - name: "PV Prognose Bewölkung"
      unique_id: pv_prognose_bewoelkung
      unit_of_measurement: "%"
      state: >
        {% set jetzt = now() %}
        {% set ns = namespace(summe=0, n=0) %}
        {% for f in wetter['weather.forecast_home'].forecast | default([]) %}
          {% set t = as_datetime(f.datetime) | as_local %}
          {% if t.date() == jetzt.date() and 9 <= t.hour < 16 and t.hour >= jetzt.hour and f.cloud_coverage is defined %}
            {% set ns.summe = ns.summe + f.cloud_coverage %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ (ns.summe / ns.n) | round(0) if ns.n > 0 else 'unknown' }}

- select:
    - name: "Batterie Modus"
      unique_id: batterie_modus_manuell
      icon: mdi:battery-sync
      options: "{{ ['Self Use', 'Netz laden', 'Halten'] }}"
      # Zustand wird direkt vom Wechselrichter gelesen
      state: >
        {% set m = states('select.solax_inverter_charger_use_mode') %}
        {% set s = states('select.solax_inverter_manual_mode_select') %}
        {% if m == 'Self Use Mode' %}Self Use
        {% elif m == 'Manual Mode' and s == 'Force Charge' %}Netz laden
        {% elif m == 'Manual Mode' and s == 'Stop Charge and Discharge' %}Halten
        {% else %}unknown{% endif %}
      select_option:
        - choose:
            - conditions: "{{ option == 'Netz laden' }}"
              sequence:
                - action: select.select_option
                  target:
                    entity_id: select.solax_inverter_charger_use_mode
                  data:
                    option: "Manual Mode"
                - delay: "00:00:02"
                - action: select.select_option
                  target:
                    entity_id: select.solax_inverter_manual_mode_select
                  data:
                    option: "Force Charge"
            - conditions: "{{ option == 'Halten' }}"
              sequence:
                - action: select.select_option
                  target:
                    entity_id: select.solax_inverter_charger_use_mode
                  data:
                    option: "Manual Mode"
                - delay: "00:00:02"
                - action: select.select_option
                  target:
                    entity_id: select.solax_inverter_manual_mode_select
                  data:
                    option: "Stop Charge and Discharge"
            - conditions: "{{ option == 'Self Use' }}"
              sequence:
                - action: select.select_option
                  target:
                    entity_id: select.solax_inverter_manual_mode_select
                  data:
                    option: "Stop Charge and Discharge"
                - action: select.select_option
                  target:
                    entity_id: select.solax_inverter_charger_use_mode
                  data:
                    option: "Self Use Mode"

- triggers:
    - trigger: time_pattern
      minutes: "/15"
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: binary_sensor.control_tibber_price_morgige_daten_verfugbar
      to: "on"
  conditions:
    - condition: template
      value_template: "{{ has_value('sensor.solax_inverter_battery_capacity') }}"
  actions:
    - variables:
        plan: {}
    - action: tibber_prices.plan_charging
      continue_on_error: true
      data:
        battery_capacity_kwh: 20
        current_soc_percent: "{{ states('sensor.solax_inverter_battery_capacity') | float(0) | round(0) }}"
      #  target_soc_percent: 80
        target_soc_percent: "{{ states('sensor.batterie_soc_ziel') | int(80) }}"
      #  must_reach_soc_percent: "{{ states('sensor.batterie_soc_mindest') | int(60) }}"
        charging_efficiency: 0.95
        discharging_efficiency: 0.95
        max_charge_power_w: 10000
        search_scope: next_24h
      #  must_reach_soc_percent: 60
      #  must_reach_by_event: next_peak_period
      #  expected_discharge_price: 48

        must_reach_soc_percent: "{{ states('sensor.batterie_soc_mindest') | int(60) if states('sensor.solax_inverter_battery_capacity') | float(0) < states('sensor.batterie_soc_mindest') | float(60) else states('sensor.batterie_soc_ziel') | int(80) }}"
        must_reach_by: >
          {% set heute = today_at(states('input_datetime.batterie_ladefrist')) %}
          {{ (heute if heute > now() else heute + timedelta(days=1)).isoformat() }}
        expected_discharge_price: "{{ states('input_number.batterie_erwarteter_preis') | float(48) }}"

        reserve_for_discharge: true
      response_variable: plan
  sensor:
    - name: "Batterie Ladeplan Start"
      unique_id: batterie_ladeplan_start
      device_class: timestamp
      state: >
        {% set segs = plan.get('charging', {}).get('schedule', {}).get('segments', []) if plan.get('intervals_found') else [] %}
        {{ segs[0].start if segs else 'unknown' }}
      attributes:
        # Ende des ERSTEN Blocks (passt zum Start)
        ende: >
          {% set segs = plan.get('charging', {}).get('schedule', {}).get('segments', []) if plan.get('intervals_found') else [] %}
          {{ segs[0].end if segs else '' }}
        # alle Blöcke, auch spätere
        segmente: >
          {% set segs = plan.get('charging', {}).get('schedule', {}).get('segments', []) if plan.get('intervals_found') else [] %}
          {% set ns = namespace(l=[]) %}
          {% for s in segs %}{% set ns.l = ns.l + [{'start': s.start, 'ende': s.end}] %}{% endfor %}
          {{ ns.l }}
        weitere_bloecke: >
          {{ [(plan.get('charging', {}).get('schedule', {}).get('segment_count', 1) | int(1)) - 1, 0] | max if plan.get('intervals_found') else 0 }}
        break_even_ct: "{{ plan.get('economics', {}).get('break_even_price', '') }}"
        preis_ct: "{{ plan.get('charging', {}).get('avg_price_per_kwh', '') }}"
        netzbezug_kwh: "{{ plan.get('charging', {}).get('total_energy_kwh', '') }}"
        ersparnis_ct: "{{ plan.get('economics', {}).get('expected_net_savings', '') }}"
        grund: "{{ plan.get('reason', '') }}"
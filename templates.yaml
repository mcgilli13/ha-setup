    # Stabiler Hausverbrauch / Grid-Sensor
    - name: "Hausverbrauch aktuell"
      unique_id: "Hausverbrauch_aktuell"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {% set bezug = states('sensor.tibber_leistung') | float(0) %}
        {% set eins = states('sensor.tibber_einspeiseleistung') | float(0) %}

        {# Wenn beide > 0, entscheide nach der dominanten Richtung #}
        {% if bezug > 0 and eins > 0 %}
          {% if bezug > eins %}
            {{ bezug - eins }}      {# Netto Richtung Bezug #}
          {% else %}
            {{ eins - bezug | float * -1 }}   {# Netto Richtung Einspeisung #}
          {% endif %}

        {# Normalfall #}
        {% elif bezug > 0 %}
          {{ bezug }}
        {% elif eins > 0 %}
          {{ -eins }}
        {% else %}
          0
        {% endif %}


    # Leistung von Waschmaschine + Trockner
    - name: "Waschen & Trocknen"
      unique_id: "Waschen_Trocknen"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {{
        states('sensor.smart_switch_23111643379067510d0248e1e9e22e55_power')| float(0) +
        states('sensor.smart_switch_23111669739212510d0248e1e9e24660_power')| float(0)
        }}

    # Leistung von Waschmaschine & Trockner für Anzeige in FlowCard
    - name: "Waschen & Trocknen (Anzeige)"
      unique_id: "Waschen_Trocknen_Flow"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {% set p = states('sensor.waschen_trocknen')| float(0) %}
        {% if p < 50 %}
          0
        {% else %}
          {{ p }}
        {% endif %}

    # Leistung Wärmepumpe (Anzeige)
    - name: "WP (Anzeige)"
      unique_id: "WP_Flow"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {% set p = states('sensor.wp_gesamtleistung_w_v2') | float(0) %}
        {% if p < 50 %}
          0
        {% else %}
          {{ p }}
        {% endif %}

    # Leistung Abwasserpumpe (Anzeige)
    - name: "Abwasser (Anzeige)"
      unique_id: "Abwasser_Flow"
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
      state: >
        {% set p = states('sensor.p_m_02_power')| float(0) %}
        {% if p < 50 %}
          0
        {% else %}
          {{ p }}
        {% endif %}

    # Energie Wallbox
    - name: "Wallbox Energy"
      unique_id: "Wallbox Energie"
      device_class: energy
      unit_of_measurement: "kWh"
      state: "{{ state_attr('sensor.wallbox', 'chargeEnergy') }}"
      icon: mdi:flash
      state_class: total_increasing

    # Ladeleistung Wallbox
    - name: "Wallbox Power"
      unique_id: "Wallbox Power"
      device_class: power
      unit_of_measurement: "W"
      state: "{{ state_attr('sensor.wallbox', 'chargingPower') }}"
      icon: mdi:flash
      state_class: measurement

    - name: "EV Ampere Ohne"
      unique_id: "ev_ampere_ohne"
      unit_of_measurement: "A"
      state: >
        {% set solar = states('sensor.solax_energy_dashboard_solax_solar_power') | float(0) %}
        {% set og = states('sensor.shellypro3em_og_leistung') | float(0) %}
        {% set eg = states('sensor.shellypro3em_eg_leistung') | float(0) %}
        {% set wp1 = 0 %}
        {% set wp2 = 0 %}
        {# set wp1 = states('sensor.shelly_wp_innen_leistung') | float(0) #}
        {# set wp2 = states('sensor.shelly_wp_aussen_leistung') | float(0) #}
        {% set ac_pat   = 500 if not is_state('climate.patrice', 'off') else 0 %}
        {% set ac_schlaf = 500 if not is_state('climate.schlafzimmer', 'off') else 0 %}
        {% set ac_wohn   = 500 if not is_state('climate.wohnzimmer', 'off') else 0 %}
        {% set ac_buro   = 500 if not is_state('climate.buro', 'off') else 0 %}
        {% set reserve = 1000 %}
        {% set haus_ohne = og + eg + wp1 + wp2 + ac_pat + ac_schlaf + ac_wohn + ac_buro + reserve %}
        {% set u_ohne = solar - haus_ohne %}
        {% set spannung = 690 if is_state('input_select.ev_auto_typ','Mercedes') else 230 %}
        {{ (u_ohne / spannung) | round(2) }}

    - name: "EV Ampere Mit"
      unique_id: "ev_ampere_mit"
      unit_of_measurement: "A"
      state: >
        {% set solar = states('sensor.solax_energy_dashboard_solax_solar_power') | float(0) %}
        {% set og = states('sensor.shellypro3em_og_leistung') | float(0) %}
        {% set eg = states('sensor.shellypro3em_eg_leistung') | float(0) %}
        {% set wp1 = 0 %}
        {% set wp2 = 0 %}
        {# set wp1 = states('sensor.shelly_wp_innen_leistung') | float(0) #}
        {# set wp2 = states('sensor.shelly_wp_aussen_leistung') | float(0) #}
        {% set ac_pat   = 500 if not is_state('climate.patrice', 'off') else 0 %}
        {% set ac_schlaf = 500 if not is_state('climate.schlafzimmer', 'off') else 0 %}
        {% set ac_wohn   = 500 if not is_state('climate.wohnzimmer', 'off') else 0 %}
        {% set ac_buro   = 500 if not is_state('climate.buro', 'off') else 0 %}
        {% set reserve = 1000 %}
        {% set ev_status = states('sensor.evc_status_code') %}
        {% set ev_laedt = ev_status == '2' %}
        {% set ev_ist_w = states('sensor.wb_leistung_w') | float(0) %}
        {% set haus_ohne = og + eg + wp1 + wp2 + ac_pat + ac_schlaf + ac_wohn + ac_buro + reserve %}
        {% set haus_mit = haus_ohne + (ev_ist_w if ev_laedt else 0) %}
        {% set u_mit = solar - haus_mit %}
        {% set spannung = 690 if is_state('input_select.ev_auto_typ','Mercedes') else 230 %}
        {{ (u_mit / spannung) | round(2) }}

    # EV Ladestrom Optimal
    - name: "EV Ladestrom Optimal"
      unique_id: "ev_ladestrom_optimal"
      unit_of_measurement: "A"
      state: >
        {% set amp_mit = states('sensor.ev_ampere_mit') | float(0) %}
        {% set amp_ohne = states('sensor.ev_ampere_ohne') | float(0) %}
        
        {# Entscheidungslogik #}
        {% if amp_mit <= 0 %}
          0
        {% elif amp_mit >= 16 %}
          16
        {% elif amp_mit < 6 %}
          {# Unter 6 A: nur halten, wenn ohne EV >= 6 A (echter knapper Überschuss durch EV) #}
          {% if amp_ohne >= 6 %}
            6
          {% else %}
            0
          {% endif %}
        {% else %}
          {{ amp_mit | round(0) }}
        {% endif %}


    # AC-THOR Sollwert
    - name: "AC-THOR Sollwert"
      unique_id: "ac_thor_sollwert"
      unit_of_measurement: "W"
      state: >
        {% set pv = states('sensor.solax_energy_dashboard_solax_solar_power') | float(0) %}
        {% set og = states('sensor.shellypro3em_og_leistung') | float(0) %}
        {% set eg = states('sensor.shellypro3em_eg_leistung') | float(0) %}
        {% set wp1 = 0 %}
        {% set wp2 = 0 %}
        {# set wp1 = states('sensor.shelly_wp_innen_leistung') | float(0) #}
        {# set wp2 = states('sensor.shelly_wp_aussen_leistung') | float(0) #}
        {% set ev_w = states('sensor.wb_leistung_w') | float(0) %}

        {# Klima-Offsets #}
        {% set ac_pat   = 500 if not is_state('climate.patrice', 'off') else 0 %}
        {% set ac_schlaf = 500 if not is_state('climate.schlafzimmer', 'off') else 0 %}
        {% set ac_wohn   = 500 if not is_state('climate.wohnzimmer', 'off') else 0 %}
        {% set ac_buro   = 500 if not is_state('climate.buro', 'off') else 0 %}

        {# Reserve #}
        {% set reserve = 1000 %}

        {# Hauslast ohne Thor #}
        {% set haus = og + eg + wp1 + wp2 + ac_pat + ac_schlaf + ac_wohn + ac_buro + ev_w + reserve %}

        {# Überschuss u #}
        {% set u = pv - haus %}

        {# EV-First nur wenn EV wirklich lädt (Status 2) #}
        {% set ev_status = states('sensor.evc_status_code') %}
        {% set ev_laedt = ev_status == '2' %}
        {% set ev_opt_a = states('sensor.ev_ladestrom_optimal') | float(0) %}

        {% if ev_laedt and ev_opt_a < 16 %}
          0
        {% else %}
          {# Mindestschwelle und Deckelung für Thor #}
          {% set out = [u, 0] | max %}
          {% set thor_min = 1000 %}
          {% set thor_max = 10000 %}
          {{ [ (out if out >= thor_min else 0), thor_max ] | min | round(0) }}
        {% endif %}

    # Statusanzeige evc
    - name: "EVC Status"
      state: >
        {% set code = states('sensor.evc_status_code') | int(0) %}
        {% if code == 0 %}Available
        {% elif code == 1 %}Preparing
        {% elif code == 2 %}Charging
        {% elif code == 3 %}Finished
        {% elif code == 4 %}Faulted
        {% elif code == 5 %}Unavailable
        {% elif code == 6 %}Reserved
        {% elif code == 7 %}Suspended EV
        {% elif code == 8 %}Suspended EVSE
        {% elif code == 9 %}Update
        {% elif code == 10 %}Card Activation
        {% elif code == 11 %}Start Delay
        {% elif code == 12 %}Charge Paused
        {% elif code == 13 %}Stopping
        {% else %}Unknown ({{ code }}){% endif %}

   # Gesamtleistung Wärmepumpe in W v2 
    - name: "WP Gesamtleistung W v2"
      unique_id: "wp_power_sum_w_v2"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement
      state: >
        {% set p =
          (states('sensor.shelly_wp_innen_leistung') | float(0)) +
          (states('sensor.shelly_wp_aussen_leistung') | float(0))
        %}
        {% if p < 0  %} 0 {% else %} {{ p }} {% endif %}

    # Wallbox Leistung in W
    - name: "WB Leistung W"
      state: "{{ (states('sensor.evc_charging_power') | float(0)) * 1000 | int}}"
      unit_of_measurement: "W"
      device_class: power
      state_class: measurement

    # Weitergereichter Energie-Sensor
    - name: "WB Energie integriert"
      state: "{{ states('sensor.wb_energie_integriert_roh') | float(0) }}"
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    # Rollladen automation 
    - name: "rollladen_oeffnen_zeit"
      device_class: timestamp
      state: >
        {% set fixed = now().replace(hour=6, minute=45, second=0, microsecond=0) %}
        {% set sun_raw = state_attr('sun.sun', 'next_rising') %}
        {% if sun_raw %}
          {% set sun = as_datetime(sun_raw) | as_local %}
          {% if sun.date() != now().date() %}
            {% set sun = sun - timedelta(days=1) %}
          {% endif %}
          {{ [fixed, sun] | max }}
        {% else %}
          {{ fixed }}
        {% endif %}
        
    - name: "Sonnenaufgang Zeit"
      state: "{{ as_timestamp(state_attr('sun.sun', 'next_rising')) | timestamp_custom('%H:%M') }}"
    - name: "Sonnenuntergang Zeit"
      state: "{{ as_timestamp(state_attr('sun.sun', 'next_setting')) | timestamp_custom('%H:%M') }}"

# -----------------------------------------------------------
# ↘️ HIER BEGINNT DER NEUE MODERNE TEMPLATE-SWITCH
# -----------------------------------------------------------

- switch:
    - name: "EVC Laden"
      unique_id: evc_ladefreigabe
      icon: mdi:ev-station
      state: "{{ states('sensor.evc_status_code') | int(0) == 2 }}"
      turn_on:
        - action: modbus.write_register
          data:
            hub: solax_evc
            unit: 1
            address: 1552
            value: 2
        - delay: "00:00:01"
        - action: modbus.write_register
          data:
            hub: solax_evc
            unit: 1
            address: 1575
            value: 4
      turn_off:
        - action: modbus.write_register
          data:
            hub: solax_evc
            unit: 1
            address: 1575
            value: 3


    #     {# EV-First nur wenn EV wirklich lädt #}
    #     {% set ev_laedt = is_state('select.solax_ev_charger_charger_use_mode', 'Fast') %}
    #     {% set ev_opt_a = states('sensor.ev_ladestrom_optimal') | float(0) %}

    #     {% if ev_laedt and ev_opt_a < 16 %}

############################################################
# ♨️ Wärmepumpe 
############################################################

- id: "WP-PV-Ueberschuss"
  alias: "Warmwasser: PV-Überschuss Boost"
  description: >
    Erhöht die Warmwasser-Solltemperatur auf 55°C, wenn der PV-Überschuss vor der WP
    über 4 kW liegt (5 Min). Senkt sie zurück auf 44°C, wenn der Netzbezug länger als
    1 Stunde über 1 kW liegt, sofort bei Netzbezug > 5 kW, oder spätestens ab 17 Uhr.
  mode: single
  triggers:
    - trigger: template
      value_template: >
        {{ is_state('binary_sensor.wp_boost_ausstehend', 'on')
          and states('sensor.pv_ueberschuss_vor_wp') | float(0) > 4000 }}
      for:
        minutes: 5
      id: ueberschuss
    - trigger: numeric_state
      entity_id: sensor.hausverbrauch_aktuell
      above: 1000
      for:
        hours: 1
      id: netzbezug_verzoegert
    - trigger: numeric_state
      entity_id: sensor.hausverbrauch_aktuell
      above: 5000
      for: "00:00:10"
      id: netzbezug_sofort
    - trigger: time
      at: "17:00:00"
      id: abend
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: ueberschuss
            - condition: time
              after: "06:00:00"
              before: "17:00:00"
          sequence:
            - action: water_heater.set_temperature
              target:
                entity_id: water_heater.zuhause_domestic_hot_water_0
              data:
                temperature: 55
        - conditions:
            - condition: trigger
              id: [netzbezug_verzoegert, netzbezug_sofort, abend]
          sequence:
            - action: water_heater.set_temperature
              target:
                entity_id: water_heater.zuhause_domestic_hot_water_0
              data:
                temperature: 44
                
- id: low_water_pressure
  alias: Wenig Wasser (Heizung)
  description: sendet eine Nachricht wenn ...
  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.zuhause_system_water_pressure
      for:
        hours: 1
        minutes: 0
        seconds: 0
      below: 1.2
  conditions: []
  actions:
    - action: notify.mobile_app_mgiphone
      metadata: {}
      data:
        message: Wasserdruck Heizung zu gering
  mode: single

- id: heizstab_stufen
  alias: Heizstab Stufen (PV-Überschuss)
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: time_pattern
      seconds: "/15"
    - trigger: state
      entity_id:
        - binary_sensor.wp_laeuft
        - input_boolean.ev_force_charging
        - input_boolean.heizstab_steuerung
    - trigger: numeric_state
      entity_id: sensor.netzbezug_effektiv
      above: 500
      for: "00:00:05"
  actions:
    - variables:
        relais: >-
          {% set tag = now().day %}
          {% set shift = tag % 3 %}
          {% if shift == 1 %}
            ["switch.keller_shelly_heizstab_l2", "switch.keller_shelly_heizstab_l3", "switch.keller_shelly_heizstab_l1"]
          {% elif shift == 2 %}
            ["switch.keller_shelly_heizstab_l3", "switch.keller_shelly_heizstab_l1", "switch.keller_shelly_heizstab_l2"]
          {% else %}
            ["switch.keller_shelly_heizstab_l1", "switch.keller_shelly_heizstab_l2", "switch.keller_shelly_heizstab_l3"]
          {% endif %}

        stufe_w: 3000
        marge_hoch: 300
        marge_runter: 500
        start_ausstehend_w: 7500
        temp_max: 65
        brutto: "{{ states('sensor.pv_ueberschuss_brutto') | float(none) }}"
        netz: "{{ states('sensor.netzbezug_effektiv') | float(none) }}"
        p_auto: "{{ states('sensor.solax_ev_charger_charge_power_total') | float(0) }}"
        aktuell: "{{ relais | select('is_state', 'on') | list | count }}"
        ausstehend: "{{ is_state('binary_sensor.wp_boost_ausstehend', 'on') }}"
        verfuegbar: "{{ (brutto - p_auto) if brutto is not none else 0 }}"
        
        # KORREKTUR: Saubere Ermittlung der letzten Änderung mittels 'expand'
        sek_seit_schalten: >
          {{ now().timestamp() - (expand(relais) | map(attribute='last_changed') | map('as_timestamp') | max | default(0)) }}

        # Batterie zuerst: unter soc_start bekommt die Batterie den Überschuss.
        # Hysterese: läuft der Heizstab schon, bleibt er bis soc_halt erlaubt,
        # damit er nicht um die 80 % herum flattert.
        soc_start: 80
        soc_halt: 75
        batterie_soc: "{{ states('sensor.solax_inverter_battery_capacity') | float(0) }}"

        erlaubt: >
          {{ is_state('input_boolean.heizstab_steuerung', 'on')
            and brutto is not none and netz is not none
            and is_state('binary_sensor.wp_laeuft', 'off')
            and is_state('input_boolean.ev_force_charging', 'off')
            and batterie_soc >= (soc_halt if aktuell | int(0) > 0 else soc_start)
            and states('sensor.zuhause_domestic_hot_water_0_tank_temperature') | float(99) < temp_max }}  
        
        # erlaubt: >
        #   {{ is_state('input_boolean.heizstab_steuerung', 'on')
        #     and brutto is not none and netz is not none
        #     and is_state('binary_sensor.wp_laeuft', 'off')
        #     and is_state('input_boolean.ev_force_charging', 'off')
        #     and states('sensor.zuhause_domestic_hot_water_0_tank_temperature') | float(99) < temp_max }}
        ziel: >
          {% set z = aktuell %}
          {% if not erlaubt %}
            {% set z = 0 %}
          {% else %}
            {% set hoch = ((verfuegbar - marge_hoch) // stufe_w) | int %}
            {% if ausstehend and aktuell == 0 and verfuegbar < start_ausstehend_w %}
              {% set hoch = 0 %}
            {% endif %}
            {% set runter = ((verfuegbar + marge_runter) // stufe_w) | int %}
            {% if netz > 1000 and aktuell > 0 %}
              {% set z = 0 %}
            {% elif is_state('binary_sensor.heizstab_netzbezug_hoch', 'on') and aktuell > 0 %}
              {% set z = aktuell - 1 %}
            {% elif hoch > aktuell and netz < 100 %}
              {% set z = [hoch, aktuell + 1, 3] | min %}
            {% elif runter < aktuell %}
              {% set z = [runter, 0] | max %}
            {% endif %}
          {% endif %}
          {{ z | int }}

    - condition: template
      value_template: >
        {{ ziel | int != aktuell | int and 
           ((ziel | int < aktuell | int and sek_seit_schalten > 10) or 
            (ziel | int > aktuell | int and sek_seit_schalten > 60)) }}

    - repeat:
        for_each: "{{ relais[:ziel | int] }}"
        sequence:
          - action: switch.turn_on
            target:
              entity_id: "{{ repeat.item }}"

    - repeat:
        for_each: "{{ relais[ziel | int:] }}"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: "{{ repeat.item }}"

- id: acthor_steuern
  alias: AC-Thor steuern (manuell und PV-Überschuss)
  description: >
    Einziger Schreiber auf den AC-Thor. Manuell: fester Wert vom Schieberegler.
    Auto: PV-Überschuss brutto minus Auto in 200-W-Schritten, mit den Sperren
    des Heizstabs (WP läuft, Zwangsladen, Batterie zuerst, Speichertemperatur).
  mode: restart
  max_exceeded: silent
  triggers:
    # Der Thor hält Werte nur 10 s, daher alle 5 s neu senden
    - trigger: time_pattern
      seconds: "/5"
    - trigger: state
      entity_id:
        - input_select.acthor_modus
        - input_number.ac_thor_manuelle_leistung
        - binary_sensor.wp_laeuft
        - input_boolean.ev_force_charging
    - trigger: numeric_state
      entity_id: sensor.netzbezug_effektiv
      above: 500
      for: "00:00:03"
  conditions:
    - condition: template
      value_template: "{{ has_value('sensor.my_pv_ac_thor_9s_leistung') }}"
  actions:
    - variables:
        schritt_w: 200
        marge_w: 300            # Reserve, wird vom Überschuss abgezogen
        start_w: 1000           # ab so viel (nach Reserve) darf der Thor anlaufen
        halt_w: 600             # läuft er schon, bleibt er bis hierhin an
        max_w: 9000
        start_ausstehend_w: 7500  # WP-Boost hat Vorrang (wie beim Heizstab)
        temp_max: 60
        soc_start: 80
        soc_halt: 75
        modus: "{{ states('input_select.acthor_modus') }}"
        manuell: "{{ modus == 'Manuell' }}"
        auto_an: "{{ modus == 'Auto' }}"        
        aktuell: "{{ states('sensor.my_pv_ac_thor_9s_leistung') | float(0) }}"
        brutto: "{{ states('sensor.pv_ueberschuss_brutto') | float(none) }}"
        netz: "{{ states('sensor.netzbezug_effektiv') | float(none) }}"
        p_auto: "{{ states('sensor.solax_ev_charger_charge_power_total') | float(0) }}"
        verfuegbar: "{{ (brutto - p_auto) if brutto is not none else 0 }}"
        ausstehend: "{{ is_state('binary_sensor.wp_boost_ausstehend', 'on') }}"
        batterie_soc: "{{ states('sensor.solax_inverter_battery_capacity') | float(0) }}"
        erlaubt: >
          {{ auto_an
             and brutto is not none and netz is not none
             and is_state('binary_sensor.wp_laeuft', 'off')
             and is_state('input_boolean.ev_force_charging', 'off')
             and batterie_soc >= (soc_halt if aktuell > 0 else soc_start)
             and state_attr('water_heater.keller_my_pv_ac_thor_9s', 'current_temperature') | float(99) < temp_max }}
        ziel: >
          {% if manuell %}
            {{ states('input_number.ac_thor_manuelle_leistung') | float(0) }}
          {% elif not erlaubt %}
            0
          {% else %}
            {% set roh = verfuegbar - marge_w %}
            {# Anlauf erst ab start_w, laufender Thor bleibt bis halt_w #}
            {% if roh < (halt_w if aktuell > 0 else start_w) %}
              {% set z = 0 %}
            {% else %}
              {% set z = (roh // schritt_w) * schritt_w %}
            {% endif %}
            {# WP-Boost ausstehend: Thor erst bei viel Überschuss anlaufen lassen #}
            {% if ausstehend and aktuell == 0 and verfuegbar < start_ausstehend_w %}
              {% set z = 0 %}
            {% endif %}
            {# Netzbezug: um den Bezug (aufgerundet auf 200 W) zurücknehmen, ab 1 kW ganz aus #}
            {% if netz > 1000 %}
              {% set z = 0 %}
            {% elif netz > 150 and aktuell > 0 %}
              {% set z = [z, aktuell - ((netz / schritt_w) | round(0, 'ceil')) * schritt_w] | min %}
            {% endif %}
            {# Hochfahren begrenzen: höchstens 3 Schritte (600 W) pro Takt #}
            {% if z > aktuell %}
              {% set z = [z, aktuell + 3 * schritt_w] | min %}
            {% endif %}
            {{ [z, 0] | max }}
          {% endif %}
        senden: "{{ [[ziel | float(0), 0] | max, max_w] | min | round(0) | int }}"

    - action: rest_command.ac_thor_power
      data:
        power: "{{ senden }}"

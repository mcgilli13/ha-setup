- id: 'batterie_ladepreis_merken'
  alias: Ladepreis merken bei Netz laden
  description: Speichert den Preis, zu dem aus dem Netz geladen wird (automatisch, manuell oder Override)
  mode: single
  triggers:
    - trigger: state
      entity_id: select.batterie_modus
      to: "Netz laden"
  conditions: []
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.batterie_entladeschwelle
      data:
        value: >
          {% set lade = state_attr('sensor.batterie_ladeplan_start', 'preis_ct') | float(states('sensor.tibber_strompreis') | float(0) * 100) %}
          {% set max_tag = (state_attr('sensor.tibber_strompreis', 'max_price') | float(0)) * 100 %}
          {{ ([lade / 0.9 + 3, max_tag - 1] | min if max_tag > 0 else lade / 0.9 + 3) | round(1) }}

- id: 'batterie_netzladen_watchdog'
  alias: Batterie Netzladen reagiert nicht
  description: Netz laden ist gesetzt, aber die Batterie lädt nicht (z. B. Wechselrichter im Idle Mode)
  mode: single
  triggers:
    - trigger: template
      value_template: >
        {{ is_state('select.batterie_modus', 'Netz laden')
           and is_state('input_boolean.override_batterie_laden', 'off')
           and states('sensor.solax_inverter_battery_capacity') | float(100) < 90
           and states('sensor.solax_energy_dashboard_solax_battery_power') | float(0) > -1000 }}
      for: "00:03:00"
  conditions: []
  actions:
    - action: notify.mobile_app_mgiphone
      data:
        message: >
          Netzladen läuft nicht: Modus "Netz laden", aber die Batterie lädt nicht
          (Wechselrichter: {{ states('sensor.solax_inverter_run_mode') }}).


- id: 'batterie_entladeschwelle_startwert'
  alias: Entladeschwelle Startwert setzen
  description: Verhindert, dass die Entladeschwelle nach einem Neustart auf 0 steht
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time
      at: "00:05:00"
  conditions:
    - condition: template
      value_template: "{{ states('input_number.batterie_entladeschwelle') | float(0) <= 0 }}"
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.batterie_entladeschwelle
      data:
        value: 70

- id: 'batterie_entladeboden_setzen'
  alias: Batterie Entladeboden setzen
  description: Steuert die Entlade-Untergrenze im Self-Use-Betrieb, ohne Manuell-Modus
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.batterie_entladeboden_ziel
      for: "00:01:00"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >
        {{ has_value('sensor.batterie_entladeboden_ziel')
           and states('number.solax_inverter_selfuse_discharge_min_soc') | float(0)
               != states('sensor.batterie_entladeboden_ziel') | float(0) }}
  actions:
    - action: number.set_value
      target:
        entity_id: number.solax_inverter_selfuse_discharge_min_soc
      data:
        value: "{{ states('sensor.batterie_entladeboden_ziel') | float(13) }}"

- id: 'batterie_modus_ziel_setzen'
  alias: Batterie Modus nach Ziel-Modus setzen
  description: Einziger Schreiber für select.batterie_modus, übernimmt sensor.batterie_ziel_modus
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.batterie_ziel_modus
      for: "00:01:00"
    - trigger: state
      entity_id: select.batterie_modus
      for: "00:01:00"
    - trigger: time_pattern
      minutes: "/10"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >
        {{ states('sensor.batterie_ziel_modus') in ['Self Use', 'Netz laden', 'Halten']
           and states('select.batterie_modus') != states('sensor.batterie_ziel_modus') }}
  actions:
    - action: select.select_option
      target:
        entity_id: select.batterie_modus
      data:
        option: "{{ states('sensor.batterie_ziel_modus') }}"
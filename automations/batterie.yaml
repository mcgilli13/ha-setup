# ---------------------------------------------------------------------------
# Batterie-Automationen
# Der Ein-Schreiber ist die einzige Stelle, die select.batterie_modus setzt.
# Alle anderen Automationen setzen nur Helfer oder Untergrenzen.
# ---------------------------------------------------------------------------

# Speichert den Preis, zu dem Netz geladen wurde, als Entladeschwelle.
# Wird bei jedem Start von "Netz laden" ausgeführt, egal ob automatisch, manuell oder per Override.
# Schwelle = Ladepreis / 0,9 (Wirkungsgrad) + 3 ct Marge, höchstens Tagesmaximum - 1 ct.
# Fehlt der Ladeplan-Preis, dient der aktuelle Tibber-Preis als Ersatz.
- id: 'batterie_ladepreis_merken'
  alias: Ladepreis merken bei Netz laden
  description: Speichert den Preis, zu dem aus dem Netz geladen wird (automatisch, manuell oder Override)
  mode: single
  triggers:
    - trigger: state
      entity_id: select.batterie_modus
      to: "Netz laden"
  conditions: []
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.batterie_entladeschwelle
      data:
        value: >
          {# Ladepreis aus dem Ladeplan, sonst aktueller Tibber-Preis #}
          {% set lade = state_attr('sensor.batterie_ladeplan_start', 'preis_ct') | float(states('sensor.tibber_strompreis') | float(0) * 100) %}
          {# Tagesmaximum aus Tibber, in ct #}
          {% set max_tag = (state_attr('sensor.tibber_strompreis', 'max_price') | float(0)) * 100 %}
          {# Schwelle: Ladepreis / Wirkungsgrad + 3 ct, höchstens Tagesmaximum - 1 ct #}
          {{ ([lade / 0.9 + 3, max_tag - 1] | min if max_tag > 0 else lade / 0.9 + 3) | round(1) }}

# Warnt, wenn Netzladen gesetzt ist, die Batterie aber nicht lädt.
# Typische Ursache: Wechselrichter im Idle-Modus.
# Die 3 Minuten verhindern Fehlalarme beim Umschalten.
- id: 'batterie_netzladen_watchdog'
  alias: Batterie Netzladen reagiert nicht
  description: Netz laden ist gesetzt, aber die Batterie lädt nicht (z. B. Wechselrichter im Idle Mode)
  mode: single
  triggers:
    - trigger: template
      value_template: >
        {# Modus Netz laden, kein Override, Ladestand unter 90 %, Batterie lädt nicht (Leistung > -1000 W) #}
        {{ is_state('select.batterie_modus', 'Netz laden')
           and is_state('input_boolean.override_batterie_laden', 'off')
           and states('sensor.solax_inverter_battery_capacity') | float(100) < 90
           and states('sensor.solax_energy_dashboard_solax_battery_power') | float(0) > -1000 }}
      for: "00:03:00"
  conditions: []
  actions:
    - action: notify.mobile_app_mgiphone
      data:
        message: >
          Netzladen läuft nicht: Modus "Netz laden", aber die Batterie lädt nicht
          (Wechselrichter: {{ states('sensor.solax_inverter_run_mode') }}).

# Setzt die Entladeschwelle auf 70 ct, wenn sie nach einem Neustart oder durch einen Fehler auf 0 steht.
# Ohne diesen Schutz würde jede Spitze als Entladefenster gelten.
# Läuft außerdem täglich um 00:05 als Kontrolle.
- id: 'batterie_entladeschwelle_startwert'
  alias: Entladeschwelle Startwert setzen
  description: Verhindert, dass die Entladeschwelle nach einem Neustart auf 0 steht
  mode: single
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: time
      at: "00:05:00"
  conditions:
    - condition: template
      value_template: "{{ states('input_number.batterie_entladeschwelle') | float(0) <= 0 }}"
  actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.batterie_entladeschwelle
      data:
        value: 70

# Schreibt die Entlade-Untergrenze des Wechselrichters aus dem Sensor batterie_entladeboden_ziel.
# Die Untergrenze bestimmt, wie weit die Batterie im Self-Use entladen darf.
# Der Sensor muss eine Minute stabil sein, damit kurze Schwankungen nichts auslösen.
# Schreibt nur, wenn Sensor und Wechselrichter-Wert voneinander abweichen.
- id: 'batterie_entladeboden_setzen'
  alias: Batterie Entladeboden setzen
  description: Steuert die Entlade-Untergrenze im Self-Use-Betrieb, ohne Manuell-Modus
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.batterie_entladeboden_ziel
      for: "00:01:00"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >
        {# Nur schreiben, wenn der Wert wirklich abweicht #}
        {{ has_value('sensor.batterie_entladeboden_ziel')
           and states('number.solax_inverter_selfuse_discharge_min_soc') | float(0)
               != states('sensor.batterie_entladeboden_ziel') | float(0) }}
  actions:
    - action: number.set_value
      target:
        entity_id: number.solax_inverter_selfuse_discharge_min_soc
      data:
        value: "{{ states('sensor.batterie_entladeboden_ziel') | float(13) }}"

# Der Ein-Schreiber: Übernimmt den Ziel-Modus in den Wechselrichter.
# Auslöser: Änderung des Ziel-Modus, Änderung des Wechselrichter-Modus (Korrektur bei Abweichung),
# Zehn-Minuten-Takt (Sicherheitsnetz) und Start von HA.
# Jeder Auslöser wartet eine Minute, damit kurze Schwankungen nicht sofort schalten.
# Die Bedingung schreibt nur bei einer echten Abweichung und nur gültige Modi.
- id: 'batterie_modus_ziel_setzen'
  alias: Batterie Modus nach Ziel-Modus setzen
  description: Einziger Schreiber für select.batterie_modus, übernimmt sensor.batterie_ziel_modus
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.batterie_ziel_modus
      for: "00:01:00"
    - trigger: state
      entity_id: select.batterie_modus
      for: "00:01:00"
    - trigger: time_pattern
      minutes: "/10"
    - trigger: homeassistant
      event: start
  conditions:
    - condition: template
      value_template: >
        {# Nur gültige Modi, und nur bei Abweichung #}
        {{ states('sensor.batterie_ziel_modus') in ['Self Use', 'Netz laden', 'Halten']
           and states('select.batterie_modus') != states('sensor.batterie_ziel_modus') }}
  actions:
    - action: select.select_option
      target:
        entity_id: select.batterie_modus
      data:
        option: "{{ states('sensor.batterie_ziel_modus') }}"
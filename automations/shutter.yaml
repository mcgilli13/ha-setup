############################################################
# 🏠 ROLLLÄDEN & MARKISEN
############################################################

- alias: Markisen auf
  id: markisen_auf
  description: ''
  triggers:
  - trigger: sun
    event: sunset
    offset: 0
  conditions: []
  actions:
  - device_id: c4b9c460e409765844ae25259ec00d41
    domain: cover
    entity_id: 8a480a885b00a1d8f5d61fc9bbf58f28
    type: open
  - device_id: dddcec644796ce97cb91f77225e1b213
    domain: cover
    entity_id: aff254e0e7acaf6fd20c6125cd4f1428
    type: open
  mode: single

- alias: Rollladen öffnen
  id: rollladen_offnen
  trigger:
    - platform: time
      at: sensor.rollladen_oeffnen_zeit
  actions:
    - action: cover.open_cover
      target:
        entity_id: cover.rollladen_wohnzimmer_vorhang
    - action: cover.set_cover_position
      target:
        entity_id: cover.rollladen_buro_vorhang
      data:
        position: 100
  mode: single

- id: rolladen_schliessen
  alias: Rollladen schließen
  description: ''
  triggers:
    - trigger: sun
      event: sunset
      offset: "0:15:00"
  conditions: []
  actions:
    - action: cover.set_cover_position
      target:
        entity_id: cover.rollladen_wohnzimmer_vorhang
      data:
        position: 10
    - action: cover.set_cover_position
      target:
        entity_id: cover.rollladen_patrice_vorhang
      data:
        position: 25
    - action: cover.set_cover_position
      target:
        entity_id: cover.rollladen_buro_vorhang
      data:
        position: 0
  mode: single
- id: 'brunnen_zeitplan'
  alias: Brunnen Zeitplan
  description: Schaltet die Brunnen-Schalter zur Start- und Endzeit
  mode: single
  triggers:
    - trigger: time
      at: input_datetime.brunnen_start
      id: ein
    - trigger: time
      at: input_datetime.brunnen_ende
      id: aus
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: ein
          sequence:
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.s1_01
                  - switch.s1_02
        - conditions:
            - condition: trigger
              id: aus
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.s1_01
                  - switch.s1_02

- id: 'kamin_zeitplan'
  alias: Kamin Zeitplan
  description: Drückt den IR-Taster des Kamins zur Start- und Endzeit
  mode: single
  triggers:
    - trigger: time
      at: input_datetime.kamin_start
      id: ein
    - trigger: time
      at: input_datetime.kamin_ende
      id: aus
  actions:
    - action: button.press
      target:
        entity_id: button.ir_fireplace_ir_ein_aus

- id: 'steckdose_04_zeitplan'
  alias: Steckdose Aussen Zeitplan
  description: Schaltet switch.outside_s_04 zwischen Start- und Endzeit ein und aus
  mode: single
  triggers:
    # Einschalten zur Startzeit
    - trigger: time
      at: input_datetime.steckdose_04_start
      id: ein
    # Ausschalten zur Endzeit
    - trigger: time
      at: input_datetime.steckdose_04_ende
      id: aus
    # Nach einem Neustart: einschalten, wenn wir gerade im Zeitfenster sind
    - trigger: homeassistant
      event: start
      id: neustart
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: ein
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.outside_s_04
        - conditions:
            - condition: trigger
              id: aus
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.outside_s_04
        - conditions:
            - condition: trigger
              id: neustart
            - condition: template
              value_template: >
                {% set jetzt = now().strftime('%H:%M:%S') %}
                {{ states('input_datetime.steckdose_04_start') <= jetzt < states('input_datetime.steckdose_04_ende') }}
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.outside_s_04
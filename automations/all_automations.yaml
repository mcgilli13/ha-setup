- id: '1735906130775'
  alias: Waschmaschine fertig
  description: ''
  triggers:
    - trigger: state
      entity_id: binary_sensor.waschmaschine_laeuft
      from: "on"
      to: "off"
  conditions: []
  actions:
    - action: notify.mobile_app_mgiphone
      data:
        message: "Waschmaschine fertig"
  mode: single

- id: '1735909372625'
  alias: Trockner fertig
  description: 'Heizen beendet, Trommel läuft noch nach'
  triggers:
    - trigger: state
      entity_id: binary_sensor.trockner_heizt
      from: "on"
      to: "off"
  conditions: []
  actions:
    - action: notify.mobile_app_mgiphone
      data:
        message: "Trockner fertig: Wäsche ist trocken, die Trommel läuft noch nach"
  mode: single

- id: 'trockner_nachlauf_ende'
  alias: Trockner Nachlauf beendet
  description: 'Optional: Trommel steht, Inhalt ist kalt'
  triggers:
    - trigger: state
      entity_id: binary_sensor.trockner_laeuft
      from: "on"
      to: "off"
  conditions: []
  actions:
    - action: notify.mobile_app_mgiphone
      data:
        message: "Trockner Nachlauf beendet: Wäsche ist kalt"
  mode: single

- id: '1739168879557'
  alias: Brunnen einschalten
  description: ''
  triggers:
    - trigger: time
      at: "08:00:00"
  conditions: []
  actions:
    - action: switch.turn_on
      target:
        entity_id:
          - switch.s1_01
          - switch.s1_02
  mode: single

- id: '1739168967583'
  alias: Brunnen ausschalten
  description: ''
  triggers:
    - trigger: time
      at: "19:00:00"
  conditions: []
  actions:
    - action: switch.turn_off
      target:
        entity_id:
          - switch.s1_01
          - switch.s1_02
  mode: single


alias: Waschmaschine fertig
triggers:
  - trigger: state
    entity_id: binary_sensor.waschmaschine_laeuft
    from: "on"
    to: "off"
actions:
  - action: notify.mobile_app_mgiphone
    data:
      message: Waschmaschine fertig
mode: single

- id: '1735909372625'
  alias: Trockner fertig
  description: sendet eine Nachricht wenn ...
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.smart_switch_23111669739212510d0248e1e9e24660_current
    for:
      hours: 0
      minutes: 2
      seconds: 0
    below: 0.2
  conditions: []
  actions:
  - action: notify.mobile_app_mgiphone
    metadata: {}
    data:
      message: Trockner fertig
  mode: single


- alias: AC•THOR dynamisch steuern
  id: 16108d049fc54851a1a449775201c261
  mode: single
  trigger:
  - platform: time_pattern
    seconds: "/10"
  condition:
  - condition: state
    entity_id: input_boolean.ac_thor_steuerung
    state: "on"
  action:
  - service: number.set_value
    target:
      entity_id: number.ac_thor_9s_1_power_ac9
    data:
      value: "{{ states('sensor.ac_thor_sollwert') | float(0) }}"


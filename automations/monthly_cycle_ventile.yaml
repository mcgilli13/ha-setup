---
- id: 'monthly_cycle_ventile'
  alias: 'Monatlich: Ventile durchfahren'
  description: >-
    Am 1. jedes Monats um 03:00 Uhr werden nacheinander alle Shelly-Ventile
    geöffnet, 10 Minuten gehalten und wieder geschlossen, damit sie sich nicht
    festsetzen.
  trigger:
    - platform: time
      at: '03:00:00'
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  action:
    - repeat:
        for_each:
          - switch.shelly_bad
          - switch.shelly_buro
          - switch.shelly_esszimmer
          - switch.shelly_flur
          - switch.shelly_kuche
          - switch.shelly_patrice
          - switch.shelly_wohnzimmer
          - switch.shelly_schlafzimmer
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ repeat.item }}"
          - service: system_log.write
            data:
              message: "Monthly cycle: opened {{ repeat.item }}"
              level: info
          - delay: '00:10:00'
          - service: switch.turn_off
            target:
              entity_id: "{{ repeat.item }}"
          - service: system_log.write
            data:
              message: "Monthly cycle: closed {{ repeat.item }}"
              level: info
  mode: single

---
# Automation: Öffne Ventile, wenn Temperatur-Sensor 'unavailable' wird
# Erklärung:
# - Trigger: einer der Aqara-Temperatursensoren wird 'unavailable'.
# - Aktion: korrespondierender Shelly-Switch 'switch.shelly_<raum>' wird eingeschaltet (Ventil auf).
# - Die Zuordnung wird automatisch aus dem Entity-Namen abgeleitet:
#   sensor.temperatur_<raum>_temperatur -> switch.shelly_<raum>
# Hinweise:
# - Diese Automation öffnet nur die Ventile; automatisches Schließen beim Wiederkehren
#   des Sensors ist aus Sicherheitsgründen auskommentiert (kann bei Bedarf aktiviert
#   oder verfeinert werden, z. B. nur wenn unser Script das Ventil geöffnet hatte).

- id: 'override_unavailable_sensors_open_vents'
  alias: 'Override: Ventile öffnen wenn Sensor unavailable'
  description: >-
    Wenn ein Aqara-Temperatursensor auf 'unavailable' geht, schaltet diese
    Automation das zugeordnete Shelly-Switch ein (Ventil öffnen). Die Zuordnung
    wird aus dem Sensor-Entity-Namen abgeleitet: sensor.temperatur_<raum>_temperatur
    -> switch.shelly_<raum>.
  trigger:
    - platform: state
      entity_id:
        - sensor.bad_klimasensor_temperature
        - sensor.buero_klimasensor_temperature
        - sensor.esszimmer_klimasensor_temperature
        - sensor.flur_klimasensor_temperature
        - sensor.kuche_klimasensor_temperature
        - sensor.patrice_klimasensor_temperature
        - sensor.wohnzimmer_klimasensor_temperature
        - sensor.schlafzimmer_klimasensor_temperature
      to: 'unavailable'
  action:
    - service: switch.turn_on
      target:
        entity_id: >-
          {{ 'switch.shelly_' ~ (trigger.entity_id.split('_')[1]) }}
    - service: system_log.write
      data:
        message: >-
          Override: opened {{ 'switch.shelly_' ~ (trigger.entity_id.split('_')[1]) }} because {{ trigger.entity_id }} became unavailable
        level: info
  mode: parallel

# Automation: Schließe Ventile wenn Sensor wieder verfügbar
# Wenn ein Sensor wieder 'available' wird, schaltet diese Automation das
# korrespondierende Shelly-Switch aus (Ventil schließen), sodass das
# Generic Thermostat wieder die Kontrolle übernehmen kann.
- id: 'override_unavailable_sensors_close_vents'
  alias: 'Override: Ventile schließen wenn Sensor wieder verfügbar'
  trigger:
    - platform: state
      entity_id:
        - sensor.bad_klimasensor_temperature
        - sensor.buero_klimasensor_temperature
        - sensor.esszimmer_klimasensor_temperature
        - sensor.flur_klimasensor_temperature
        - sensor.kuche_klimasensor_temperature
        - sensor.patrice_klimasensor_temperature
        - sensor.wohnzimmer_klimasensor_temperature
        - sensor.schlafzimmer_klimasensor_temperature
      to: 'available'
  action:
    - service: switch.turn_off
      target:
        entity_id: >-
          {{ 'switch.shelly_' ~ (trigger.entity_id.split('_')[1]) }}
    - service: system_log.write
      data:
        message: >-
          Override: closed {{ 'switch.shelly_' ~ (trigger.entity_id.split('_')[1]) }} because {{ trigger.entity_id }} became available
        level: info
  mode: parallel
---
- id: 'monthly_cycle_ventile'
  alias: 'Monatlich: Ventile durchfahren'
  description: >-
    Am 1. jedes Monats um 03:00 Uhr werden nacheinander alle Shelly-Ventile
    geöffnet, 10 Minuten gehalten und wieder geschlossen, damit sie sich nicht
    festsetzen.
  trigger:
    - platform: time
      at: '03:00:00'
  condition:
    - condition: template
      value_template: "{{ now().day == 1 }}"
  action:
    - repeat:
        for_each:
          - switch.shelly_bad
          - switch.shelly_buro
          - switch.shelly_esszimmer
          - switch.shelly_flur
          - switch.shelly_kuche
          - switch.shelly_patrice
          - switch.shelly_wohnzimmer
          - switch.shelly_schlafzimmer
        sequence:
          - service: switch.turn_on
            target:
              entity_id: "{{ repeat.item }}"
          - service: system_log.write
            data:
              message: "Monthly cycle: opened {{ repeat.item }}"
              level: info
          - delay: '00:10:00'
          - service: switch.turn_off
            target:
              entity_id: "{{ repeat.item }}"
          - service: system_log.write
            data:
              message: "Monthly cycle: closed {{ repeat.item }}"
              level: info
  mode: single

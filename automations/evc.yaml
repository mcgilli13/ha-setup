##################### NEU (native solax_modbus-Integration) #####################

- alias: EV Start
  id: ev_start_minimal
  mode: single

  trigger:
    # Anhaltender Überschuss – 45s Mindestdauer aus der alten Logik übernommen
    - platform: numeric_state
      entity_id: sensor.ev_ladestrom_optimal
      above: 6.5
      for: "00:00:45"

    # Zwangsladen jederzeit
    - platform: state
      entity_id: input_boolean.ev_force_charging
      to: "on"

  condition:
    - condition: or
      conditions:
        # Solar-Start: PV-Überschuss laut Schätzung UND kein Netzbezug laut echter Messung
        - condition: and
          conditions:
            - condition: numeric_state
              entity_id: sensor.ev_ladestrom_optimal
              above: 0
            - condition: template
              value_template: "{{ states('sensor.hausverbrauch_aktuell') | float(0) <= 0 }}"
        # Zwangsladen: immer, egal woher der Strom kommt
        - condition: state
          entity_id: input_boolean.ev_force_charging
          state: "on"

    # Lädt noch nicht (verhindert doppeltes Starten / doppelte Trigger-Auslösung)
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Stop"

  action:
    - variables:
        optimal: "{{ states('sensor.ev_ladestrom_optimal') | float(0) }}"
        strom: >
          {% if is_state('input_boolean.ev_force_charging','on') %}
            16
          {% else %}
            {{ [optimal, 6] | max | round(0) }}
          {% endif %}

    # Ladestrom setzen – native Integration, kein Register-Write mehr nötig
    - action: number.set_value
      target:
        entity_id: number.solax_ev_charger_charge_current
      data:
        value: "{{ strom }}"

    # Sync-Helper für Dashboard/Verlauf (input_number bleibt als Anzeige-Sollwert bestehen,
    # falls Dashboards/History-Graphen noch darauf zeigen)
    - action: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: "{{ strom }}"

    - delay: "00:00:01"

    # Laden starten – ersetzt modbus.write_register Adresse 1575 = 4
    - action: select.select_option
      target:
        entity_id: select.solax_ev_charger_charger_use_mode
      data:
        option: "Fast"

- alias: EV Stop
  id: ev_stop
  mode: single

  trigger:
    # Normaler Stopp: 1 Minute anhaltender Mangel an Überschuss
    - platform: numeric_state
      entity_id: sensor.ev_ladestrom_optimal
      below: 6
      for: "00:01:00"

  condition:
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Fast"
    - condition: state
      entity_id: input_boolean.ev_force_charging
      state: "off"

  action:
    - action: select.select_option
      target:
        entity_id: select.solax_ev_charger_charger_use_mode
      data:
        option: "Stop"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: 0

- alias: EV Notaus
  id: ev_notaus
  mode: single

  trigger:
    # SOFORT, keine Verzögerung
    - platform: numeric_state
      entity_id: sensor.hausverbrauch_aktuell
      above: 2000

  condition:
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Fast"
    # Zwangsladen hat Vorrang vor dem Notaus – bewusste Entscheidung: wenn
    # der Nutzer manuell "voll laden, koste es was es wolle" eingeschaltet
    # hat, soll auch eine Netzbezug-Spitze das nicht stoppen.
    - condition: state
      entity_id: input_boolean.ev_force_charging
      state: "off"

  action:
    - action: select.select_option
      target:
        entity_id: select.solax_ev_charger_charger_use_mode
      data:
        option: "Stop"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: 0

- alias: EV Ladestrom Nachregeln
  id: ev_ladestrom_nachregeln
  mode: single

  trigger:
    - platform: time_pattern
      seconds: "/10"

  condition:
    # Lädt gerade
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Fast"

    # 30s Mindestabstand seit letzter Ladestrom-Änderung – NEU, verhindert
    # das "Hyperventilieren" bei schwankendem Überschuss
    - condition: template
      value_template: >
        {{ (now() - states.number.solax_ev_charger_charge_current.last_changed).total_seconds() >= 30 }}

  action:
    - variables:
        optimal: "{{ states('sensor.ev_ladestrom_optimal') | float(0) }}"
        aktuell: "{{ states('number.solax_ev_charger_charge_current') | float(0) }}"
        netz: "{{ states('sensor.hausverbrauch_aktuell') | float(0) }}"
        zwang: "{{ is_state('input_boolean.ev_force_charging', 'on') }}"
        min_a: 6
        max_a: 16
        step: 1
        ziel: >
          {% if zwang %}
            {{ max_a }}
          {% else %}
            {% set z = aktuell %}
            {% if netz < -900 %}
              {% set z = z + step %}
            {% endif %}
            {% if netz > 200 %}
              {% set z = z - step %}
            {% endif %}
            {% if z < optimal %}
              {% set z = optimal %}
            {% endif %}
            {% if z < min_a %}
              {{ min_a }}
            {% elif z > max_a %}
              {{ max_a }}
            {% else %}
              {{ z | round(0) }}
            {% endif %}
          {% endif %}
        diff: "{{ (ziel | float(0) - aktuell) | abs }}"

    # Deadband 0.5 A – unverändert aus der alten Logik übernommen
    - condition: template
      value_template: "{{ diff > 0.5 }}"

    - action: number.set_value
      target:
        entity_id: number.solax_ev_charger_charge_current
      data:
        value: "{{ ziel }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: "{{ ziel }}"

- alias: EV Nachtladen Start
  id: ev_nachtladen_start
  trigger:
    - platform: time
      at: "02:00:00"
  condition:
    - condition: state
      entity_id: input_boolean.ev_nachtladen
      state: "on"
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_force_charging

- alias: EV Nachtladen Ende
  id: ev_nachtladen_ende
  trigger:
    - platform: time
      at: "06:00:00"
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_force_charging

- alias: EV Fahrzeugtyp automatisch erkennen
  id: ev_fahrzeugtyp_erkennen
  mode: single

  trigger:
    - platform: time_pattern
      seconds: "/10"

  condition:
    # Nur während aktivem Laden prüfen
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Fast"

    # Genug Leistung für eine zuverlässige Messung (deutlich über Rauschen/Leckstrom,
    # aber unter der Mindest-Ladeleistung von 6A einphasig ~1380W)
    - condition: numeric_state
      entity_id: sensor.solax_ev_charger_charge_power_total
      above: 500

    # 15s Stabilität seit letzter Leistungsänderung, damit wir nicht mitten
    # in der Anlaufphase (PWM-Verhandlung) messen
    - condition: template
      value_template: >
        {{ (now() - states.sensor.solax_ev_charger_charge_power_total.last_changed).total_seconds() >= 15 }}

  action:
    - variables:
        l1: "{{ states('sensor.solax_ev_charger_charge_current_l1') | float(0) }}"
        l2: "{{ states('sensor.solax_ev_charger_charge_current_l2') | float(0) }}"
        l3: "{{ states('sensor.solax_ev_charger_charge_current_l3') | float(0) }}"
        erkannter_typ: >
          {% if l1 > 1 and l2 < 1 and l3 < 1 %}
            Cupra
          {% elif l1 > 1 and l2 > 1 and l3 > 1 %}
            Mercedes
          {% else %}
            unklar
          {% endif %}

    # Nur bei eindeutigem Ergebnis und nur bei tatsächlicher Änderung setzen
    # (vermeidet unnötige State-Writes/Log-Rauschen)
    - condition: template
      value_template: "{{ erkannter_typ in ['Mercedes', 'Cupra'] }}"
    - condition: template
      value_template: "{{ erkannter_typ != states('input_select.ev_auto_typ') }}"

    - action: input_select.select_option
      target:
        entity_id: input_select.ev_auto_typ
      data:
        option: "{{ erkannter_typ }}"
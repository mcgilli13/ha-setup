#####################################
##  Routine für Wallbox (SolaX EV Charger – solax_modbus Integration)
##
## Migriert von der eigenen Modbus-YAML-Integration (register-writes über
## hub "solax_evc") auf die native solax_modbus HACS-Integration.
##
## Alte Logik ist unten komplett auskommentiert erhalten (Register 1575/1576
## über modbus.write_register) – falls ein Rollback nötig ist, einfach die
## "NEU"-Sektion wieder auskommentieren und die "ALT"-Sektion aktivieren.
##
## Was sich geändert hat:
## - Start/Stopp läuft jetzt über select.solax_ev_charger_charger_use_mode
##   ("Fast" = laden, "Stop" = aus) statt über rohe Modbus-Register.
##   Getestet und bestätigt: control_command spiegelt das nur nach, ist also
##   nicht mehr nötig.
## - Ladestrom über number.solax_ev_charger_charge_current statt
##   modbus.write_register auf Register 1576.
## - Neuer, eigenständiger "EV Notaus": Netzbezug > 2000 W stoppt SOFORT ohne
##   Verzögerung. Die alte "EV Stop"-Automation hatte hier fälschlich eine
##   90-Sekunden-Verzögerung – das war kein echter Notaus, sondern eher ein
##   zweiter, langsamerer Normalstopp.
## - "EV Stop" (normal) reagiert jetzt auf 1 Minute anhaltenden Mangel an
##   Überschuss (sensor.ev_ladestrom_optimal < 6), statt nur auf Netzbezug.
## - "EV Ladestrom Nachregeln" (Ex-"Dynamik Komplett") hat jetzt einen
##   30-Sekunden-Mindestabstand zwischen zwei Anpassungen (über
##   number.solax_ev_charger_charge_current.last_changed), zusätzlich zum
##   bestehenden 0.5A-Deadband – verhindert das "Hyperventilieren".
## - sensor.evc_status_code / sensor.wb_leistung_w (alte, eigene Sensoren)
##   werden nicht mehr referenziert – Status wird jetzt direkt über
##   select.solax_ev_charger_charger_use_mode gelesen. Falls diese beiden
##   Sensoren anderswo (z. B. Dashboard-Logbuch) noch verwendet werden,
##   bitte prüfen, ob sie nach der Migration überhaupt noch aktuelle Werte
##   liefern.
##
#####################################


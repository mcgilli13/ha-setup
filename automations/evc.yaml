#####################################################################
##  Wallbox-Steuerung (SolaX EV Charger, native solax_modbus-Integration)
##  Stand: 28.09.2026
##
##  Idee: Das Auto lädt mit PV-Überschuss. Die Batterie zählt dabei NICHT
##  als Quelle (Batterie-Entladung wird wie Netzbezug behandelt).
##  Ausnahme: Zwangsladen = bewusst, manuell, volle Leistung ohne Regelung.
##
##  Steuerung der Wallbox
##  - Start/Stopp:  select.solax_ev_charger_charger_use_mode
##                  "Fast" = laden, "Stop" = aus (control_command spiegelt nur)
##  - Ladestrom:    number.solax_ev_charger_charge_current (6-16 A)
##  - Status:       sensor.solax_ev_charger_run_mode
##                  Available = nichts angesteckt, Preparing = Handshake,
##                  Charging = lädt, Finishing = angesteckt aber lädt nicht
##                  (nach eigenem Stopp ODER wenn das Auto voll ist)
##
##  Abhängigkeiten (müssen existieren)
##  - templates.yaml:  sensor.ev_ladestrom_optimal   (Zielstrom aus PV-Überschuss)
##                     sensor.ev_ampere_ohne, sensor.netzbezug_effektiv
##  - Helfer:          input_boolean.ev_force_charging, input_boolean.ev_nachtladen,
##                     input_number.ev_ladestrom (Anzeige), input_select.ev_auto_typ,
##                     counter.ev_startversuche
##
##  Automationen
##  - EV Start
##      Solar-Start, wenn 3 Min am Stück gilt: Modus "Stop", Auto angesteckt,
##      Ziel > 6.5 A, effektiver Bezug < 100 W, Startsperre nicht aktiv.
##      Setzt Ladestrom und schaltet auf "Fast", wartet bis zu 90 s auf
##      Run Mode "Charging". Erfolg: Fehlversuche auf 0. Misserfolg (Auto meist
##      voll): Zähler +1 und Modus "Stop". Zwangsladen startet sofort und
##      ignoriert die Sperre.
##  - EV Startsperre zurücksetzen
##      Nach 2 Fehlversuchen ist der Solar-Start gesperrt. Entsperrt wird,
##      sobald der Run Mode "Available" erreicht (aus- und wieder einstecken).
##  - EV Stop   (nur ohne Zwangsladen, pegelbasiert)
##      Ziel < 6 A seit 1 Min ODER effektiver Bezug > 300 W seit 2 Min.
##  - EV Notaus (nur ohne Zwangsladen)
##      Effektiver Bezug > 2000 W: SOFORT stoppen, ohne Verzögerung.
##  - EV Ladestrom Nachregeln   (alle 10 s, nur bei "Fast")
##      Ziel ist Deckel und Boden. Runter direkt aufs Ziel, hoch nur in
##      1-A-Schritten und nur bei effektivem Bezug < 100 W. Sicherheitsnetz:
##      bei Bezug > 200 W zusätzlich -1 A. Mindestabstand 30 s zwischen zwei
##      Änderungen, Deadband 0.5 A (gegen "Hyperventilieren").
##      Zwangsladen: fest 16 A.
##  - EV Nachtladen Start/Ende
##      02:00 schaltet (bei aktivem Schalter) das Zwangsladen ein, 06:00 aus.
##  - EV Fahrzeugtyp automatisch erkennen   (alle 10 s, nur beim Laden)
##      Ab > 500 W und 15 s stabiler Leistung: nur L1 aktiv = Cupra (1-phasig),
##      L1+L2+L3 aktiv = Mercedes (3-phasig). Setzt input_select.ev_auto_typ,
##      das die Ampere-Berechnung in templates.yaml (230 V / 690 V) nutzt.
##
##  Bewusste Entscheidungen
##  - "Effektiver Bezug" = Netzbezug + Batterie-Entladung
##    (sensor.netzbezug_effektiv). Laden aus der Batterie gibt es nur im
##    Zwangsladen.
##  - Zwangsladen hat Vorrang vor Stop und Notaus.
##  - Start (3 Min) ist träger als Stopp (1-2 Min).
##  - Stop/Notaus/Start nutzen Template-Trigger mit Zustand statt
##    numeric_state-Kreuzungen, damit sie auch nach z. B. Ende des
##    Zwangsladens (06:00) oder nach einem Stopp neu bewerten.
##
##  Alte Logik (eigene Modbus-YAML, modbus.write_register auf Hub "solax_evc",
##  Register 1575/1576): siehe Git-Historie.
#####################################################################

- alias: EV Start
  id: ev_start_minimal
  mode: single

  trigger:
    # Pegelbasiert: 3 Min am Stück. Gesperrt, sobald 2 Startversuche
    # gescheitert sind (Zähler >= 2), und nur bei angestecktem Auto.
    - platform: template
      value_template: >
        {{ is_state('select.solax_ev_charger_charger_use_mode', 'Stop')
           and states('sensor.solax_ev_charger_run_mode') not in ['Available', 'unknown', 'unavailable']
           and states('sensor.ev_ladestrom_optimal') | float(0) > 6.5
           and is_state('binary_sensor.ev_start_ueberschuss_ok', 'on') 
           and states('sensor.netzbezug_effektiv') | float(0) < 100
           and states('counter.ev_startversuche') | int(0) < 2 }}
      for: "00:03:00"

    # Zwangsladen jederzeit (ignoriert die Startsperre)
    - platform: state
      entity_id: input_boolean.ev_force_charging
      to: "on"

  condition:
    - condition: or
      conditions:
        # Solar-Start: Überschuss, kein effektiver Bezug, Sperre nicht aktiv
        - condition: and
          conditions:
            - condition: state
              entity_id: binary_sensor.ev_start_ueberschuss_ok
              state: "on"
            - condition: numeric_state
              entity_id: sensor.ev_ladestrom_optimal
              above: 0
            - condition: template
              value_template: "{{ states('sensor.netzbezug_effektiv') | float(0) <= 100 }}"
            - condition: template
              value_template: "{{ states('counter.ev_startversuche') | int(0) < 2 }}"
        # Zwangsladen: immer, egal woher der Strom kommt
        - condition: state
          entity_id: input_boolean.ev_force_charging
          state: "on"

    # Auto muss angesteckt sein
    - condition: template
      value_template: "{{ states('sensor.solax_ev_charger_run_mode') not in ['Available', 'unknown', 'unavailable'] }}"

    # Lädt noch nicht (verhindert doppeltes Starten)
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Stop"

  action:
    - variables:
        optimal: "{{ states('sensor.ev_ladestrom_optimal') | float(0) }}"
        strom: >
          {% if is_state('input_boolean.ev_force_charging','on') %}
            16
          {% else %}
            {{ [optimal, 6] | max | round(0) }}
          {% endif %}

    - action: number.set_value
      target:
        entity_id: number.solax_ev_charger_charge_current
      data:
        value: "{{ strom }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: "{{ strom }}"

    - delay: "00:00:01"

    - action: select.select_option
      target:
        entity_id: select.solax_ev_charger_charger_use_mode
      data:
        option: "Fast"

    # Hat die Wallbox wirklich angefangen zu laden? (gestern dauerte das 10-18 s)
    - wait_template: "{{ is_state('sensor.solax_ev_charger_run_mode', 'Charging') }}"
      timeout: "00:01:30"
      continue_on_timeout: true

    - choose:
        # Erfolg: Fehlversuche zurücksetzen
        - conditions:
            - condition: state
              entity_id: sensor.solax_ev_charger_run_mode
              state: "Charging"
          sequence:
            - action: counter.reset
              target:
                entity_id: counter.ev_startversuche
      # Misserfolg (Auto voll oder Wallbox lehnt ab): zählen und sauber aus
      default:
        - action: counter.increment
          target:
            entity_id: counter.ev_startversuche
        - action: select.select_option
          target:
            entity_id: select.solax_ev_charger_charger_use_mode
          data:
            option: "Stop"
        - action: input_number.set_value
          target:
            entity_id: input_number.ev_ladestrom
          data:
            value: 0

- alias: EV Stop
  id: ev_stop
  mode: single

  trigger:
    # Pegelbasiert inkl. Gate: bewertet auch neu, wenn Zwangsladen endet (06:00)
    - platform: template
      value_template: >
        {{ is_state('select.solax_ev_charger_charger_use_mode', 'Fast')
           and is_state('input_boolean.ev_force_charging', 'off')
           and states('sensor.ev_ladestrom_optimal') | float(0) < 6 }}
      for: "00:01:00"
    - platform: template
      value_template: >
        {{ is_state('select.solax_ev_charger_charger_use_mode', 'Fast')
           and is_state('input_boolean.ev_force_charging', 'off')
           and states('sensor.netzbezug_effektiv') | float(0) > 300 }}
      for: "00:02:00"

  condition:
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Fast"
    - condition: state
      entity_id: input_boolean.ev_force_charging
      state: "off"

  action:
    - action: select.select_option
      target:
        entity_id: select.solax_ev_charger_charger_use_mode
      data:
        option: "Stop"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: 0

- alias: EV Notaus
  id: ev_notaus
  mode: single

  trigger:
    - platform: template
      value_template: >
        {{ is_state('select.solax_ev_charger_charger_use_mode', 'Fast')
           and is_state('input_boolean.ev_force_charging', 'off')
           and states('sensor.netzbezug_effektiv') | float(0) > 2000 }}

  condition:
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Fast"
    # Zwangsladen hat Vorrang vor dem Notaus – bewusste Entscheidung: wenn
    # der Nutzer manuell "voll laden, koste es was es wolle" eingeschaltet
    # hat, soll auch eine Netzbezug-Spitze das nicht stoppen.
    - condition: state
      entity_id: input_boolean.ev_force_charging
      state: "off"

  action:
    - action: select.select_option
      target:
        entity_id: select.solax_ev_charger_charger_use_mode
      data:
        option: "Stop"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: 0

- alias: EV Ladestrom Nachregeln
  id: ev_ladestrom_nachregeln
  mode: single

  trigger:
    - platform: time_pattern
      seconds: "/10"

  condition:
    # Lädt gerade
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Fast"

    # 30s Mindestabstand seit letzter Ladestrom-Änderung – NEU, verhindert
    # das "Hyperventilieren" bei schwankendem Überschuss
    - condition: template
      value_template: >
        {{ (now() - states.number.solax_ev_charger_charge_current.last_changed).total_seconds() >= 30 }}

  action:
    - variables:
        optimal: "{{ states('sensor.ev_ladestrom_optimal') | float(0) }}"
        aktuell: "{{ states('number.solax_ev_charger_charge_current') | float(0) }}"
        bezug_eff: "{{ states('sensor.netzbezug_effektiv') | float(0) }}"
        zwang: "{{ is_state('input_boolean.ev_force_charging', 'on') }}"
        min_a: 6
        max_a: 16
        step: 1
        ziel: >
          {% if zwang %}
            {{ max_a }}
          {% else %}
            {% set z = aktuell %}
            {# Runter: direkt aufs Ziel (Abschalten übernimmt EV Stop) #}
            {% if optimal < aktuell %}
              {% set z = [optimal, min_a] | max %}
            {# Hoch: nur schrittweise UND nur wenn kein Bezug (Netz + Batterie) #}
            {% elif optimal > aktuell and bezug_eff < 100 %}
              {% set z = aktuell + step %}
            {% endif %}
            {# Sicherheitsnetz für ungemessene Lasten: Bezug -> 1 A runter #}
            {% if bezug_eff > 200 %}
              {% set z = z - step %}
            {% endif %}
            {{ [[z, max_a] | min, min_a] | max | round(0) }}
          {% endif %}
        diff: "{{ (ziel | float(0) - aktuell) | abs }}"

    # Deadband 0.5 A – unverändert aus der alten Logik übernommen
    - condition: template
      value_template: "{{ diff > 0.5 }}"

    - action: number.set_value
      target:
        entity_id: number.solax_ev_charger_charge_current
      data:
        value: "{{ ziel }}"

    - action: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: "{{ ziel }}"

- alias: EV Nachtladen Start
  id: ev_nachtladen_start
  trigger:
    - platform: time
      at: "02:00:00"
  condition:
    - condition: state
      entity_id: input_boolean.ev_nachtladen
      state: "on"
  action:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_force_charging

- alias: EV Nachtladen Ende
  id: ev_nachtladen_ende
  trigger:
    - platform: time
      at: "06:00:00"
  action:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_force_charging

- alias: EV Fahrzeugtyp automatisch erkennen
  id: ev_fahrzeugtyp_erkennen
  mode: single

  trigger:
    - platform: time_pattern
      seconds: "/10"

  condition:
    # Nur während aktivem Laden prüfen
    - condition: state
      entity_id: select.solax_ev_charger_charger_use_mode
      state: "Fast"

    # Genug Leistung für eine zuverlässige Messung (deutlich über Rauschen/Leckstrom,
    # aber unter der Mindest-Ladeleistung von 6A einphasig ~1380W)
    - condition: numeric_state
      entity_id: sensor.solax_ev_charger_charge_power_total
      above: 500

    # 15s Stabilität seit letzter Leistungsänderung, damit wir nicht mitten
    # in der Anlaufphase (PWM-Verhandlung) messen
    - condition: template
      value_template: >
        {{ (now() - states.sensor.solax_ev_charger_charge_power_total.last_changed).total_seconds() >= 15 }}

  action:
    - variables:
        l1: "{{ states('sensor.solax_ev_charger_charge_current_l1') | float(0) }}"
        l2: "{{ states('sensor.solax_ev_charger_charge_current_l2') | float(0) }}"
        l3: "{{ states('sensor.solax_ev_charger_charge_current_l3') | float(0) }}"
        erkannter_typ: >
          {% if l1 > 1 and l2 < 1 and l3 < 1 %}
            Cupra
          {% elif l1 > 1 and l2 > 1 and l3 > 1 %}
            Mercedes
          {% else %}
            unklar
          {% endif %}

    # Nur bei eindeutigem Ergebnis und nur bei tatsächlicher Änderung setzen
    # (vermeidet unnötige State-Writes/Log-Rauschen)
    - condition: template
      value_template: "{{ erkannter_typ in ['Mercedes', 'Cupra'] }}"
    - condition: template
      value_template: "{{ erkannter_typ != states('input_select.ev_auto_typ') }}"

    - action: input_select.select_option
      target:
        entity_id: input_select.ev_auto_typ
      data:
        option: "{{ erkannter_typ }}"

- alias: EV Startsperre zurücksetzen
  id: ev_startsperre_reset
  trigger:
    - platform: state
      entity_id: sensor.solax_ev_charger_run_mode
      to: "Available"
  action:
    - action: counter.reset
      target:
        entity_id: counter.ev_startversuche
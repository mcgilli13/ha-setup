#####################################
##  Routine für Wallbox
##
## - EV Start: Ladestrom setzen und Laden starten, wenn PV‑Überschuss (stabil >5.5A für 30s)
##             oder Zwangsladen aktiviert wird
## - EV Stop: Laden stoppen, wenn Netzbezug > 1.5 kW anhält und nicht zwangsgeladen wird
## - EV Ladestrom Dynamik Komplett: Ladestrom alle 10 Sekunden anpassen, wenn Auto lädt
##             oder startbereit ist
## - EV Nachtladen Start: Zwangsladen aktivieren um 2 Uhr, wenn Nachtladen aktiviert ist
##             -> garantiert volle Ladung bis 6 Uhr, unabhängig von PV/Netzbezug
## - EV Nachtladen Ende: Zwangsladen um 6 Uhr deaktivieren
##
#####################################

- alias: EV Start
  id: ev_start_minimal
  mode: single

  trigger:
    # NEU: "for: 30s" verhindert, dass jeder kurze Ausschlag des verrauschten
    # Sensors (schwankt sekündlich zwischen 0-16A) einen neuen Start auslöst.
    # Erst wenn der Wert 30s stabil über 5.5A bleibt, wird gestartet.
    - platform: numeric_state
      entity_id: sensor.ev_ladestrom_optimal
      above: 5.5
      for:
        seconds: 30

    # FIX: "to: on" ergänzt - vorher feuerte dieser Trigger auch beim
    # AUSSCHALTEN von Zwangsladen (z.B. jeden Morgen um 6 Uhr durch
    # "EV Nachtladen Ende"), was einen ungewollten Start provozieren konnte.
    - platform: state
      entity_id: input_boolean.ev_force_charging
      to: "on"

  condition:
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ states('sensor.ev_ladestrom_optimal') | float(0) > 0 }}"
        - condition: state
          entity_id: input_boolean.ev_force_charging
          state: "on"

    - condition: template
      value_template: "{{ states('sensor.evc_status_code') in ['0','1','3'] }}"

    - condition: numeric_state
      entity_id: sensor.wb_leistung_w
      below: 50

  action:
    - variables:
        optimal: "{{ states('sensor.ev_ladestrom_optimal') | float(0) }}"
        strom: >
          {% if is_state('input_boolean.ev_force_charging','on') %}
            16
          {% else %}
            {{ optimal }}
          {% endif %}

    - service: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: "{{ strom }}"

    - delay: "00:00:01"

    - service: modbus.write_register
      data:
        hub: solax_evc
        unit: 1
        address: 1576
        value: "{{ (strom * 100) | int }}"

    - delay: "00:00:01"

    - service: modbus.write_register
      data:
        hub: solax_evc
        unit: 1
        address: 1575
        value: 4

- alias: EV Stop
  id: ev_stop
  mode: single

  trigger:
    # GEÄNDERT: Schwelle von 2000 auf 1500 W gesenkt (wie gewünscht)
    - platform: numeric_state
      entity_id: sensor.hausverbrauch_aktuell
      above: 1500   # Netzbezug > 1.5 kW
      for:
        seconds: 90

  condition:
    - condition: state
      entity_id: sensor.evc_status_code
      state: "2"
    # Unverändert: Während Zwangsladen (2-6 Uhr) wird NIE gestoppt,
    # damit das Auto morgens garantiert voll ist.
    - condition: state
      entity_id: input_boolean.ev_force_charging
      state: "off"

  action:
    - service: modbus.write_register
      data:
        hub: solax_evc
        unit: 1
        address: 1575
        value: 3

    - service: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: 0

- alias: EV Ladestrom Dynamik Komplett
  id: ev_dynamik_komplett
  mode: single

  trigger:
    - platform: time_pattern
      seconds: "/10"

  condition:
    - condition: template
      value_template: "{{ states('sensor.evc_status_code') in ['1','2'] }}"

    - condition: template
      value_template: >
        {{ (now() - states.sensor.evc_status_code.last_changed).total_seconds() > 5 }}

  action:
    - variables:
        optimal: "{{ states('sensor.ev_ladestrom_optimal') | float(0) }}"
        aktuell: "{{ states('input_number.ev_ladestrom') | float(0) }}"
        netz: "{{ states('sensor.hausverbrauch_aktuell') | float(0) }}"
        zwang: "{{ is_state('input_boolean.ev_force_charging','on') }}"

        min_a: 6
        max_a: 16
        step: 1

        ziel: >
          {% if zwang %}
            {{ max_a }}
          {% else %}
            {% set z = aktuell %}

            {# --- UPSCALE: PV-Überschuss --- #}
            {% if netz < -900 %}
              {% set z = z + step %}
            {% endif %}

            {# --- DOWNSCALE: Netzbezug vermeiden --- #}
            {% if netz > 200 %}
              {% set z = z - step %}
            {% endif %}

            {# ENTFERNT: die alte "z < optimal -> z = optimal"-Zeile.
               Sie zog z bei jedem 10s-Tick direkt auf den verrauschten
               Rohwert von "optimal" - das hat die gesamte Rampen-/
               Hysterese-Logik oben ausgehebelt. Die Upscale-Regel
               (netz < -900) sorgt bereits schrittweise dafür, dass bei
               PV-Überschuss hochgefahren wird - nur eben geglättet
               mit max. ±1A pro 10s statt in einem Sprung. #}

            {% if z < min_a %}
              {{ min_a }}
            {% elif z > max_a %}
              {{ max_a }}
            {% else %}
              {{ z | round(0) }}
            {% endif %}
          {% endif %}

        diff: "{{ (ziel - aktuell) | abs }}"

    - condition: template
      value_template: "{{ diff > 0.5 }}"

    - service: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: "{{ ziel }}"

    - service: modbus.write_register
      data:
        hub: solax_evc
        unit: 1
        address: 1576
        value: "{{ (ziel * 100) | int }}"

- alias: EV Nachtladen Start
  id: ev_nachtladen_start
  trigger:
    - platform: time
      at: "02:00:00"
  condition:
    - condition: state
      entity_id: input_boolean.ev_nachtladen
      state: "on"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_force_charging

- alias: EV Nachtladen Ende
  id: ev_nachtladen_ende
  trigger:
    - platform: time
      at: "06:00:00"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_force_charging

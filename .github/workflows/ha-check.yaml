name: Home Assistant Config Check

env:
  HA_VERSION: "2026.5.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Create dummy secrets.yaml
        run: |
          cat > secrets.yaml << 'EOF'
          influxdb_user: dummy
          influxdb_password: dummy
          solax_api_url: "https://dummy.com"
          solax_token: dummy
          solax_sn: dummy
          solax_api_request_body: dummy
          solax_wallbox_sn: dummy
          mypv_token: dummy
          mypv_serial: dummy
          tibber_authorization: dummy
          solax_modbus_ip: dummy
          EOF

      - name: Home Assistant Config Check
        uses: frenck/action-home-assistant@v1
        with:
          path: "."
          mypv_serial: dummy
          tibber_authorization: dummy
          solax_modbus_ip: dummy
          EOF

      - name: Home Assistant Config Check
        uses: frenck/action-home-assistant@v1
        with:
          path: "."

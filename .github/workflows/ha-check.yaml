name: Home Assistant Config Check

env:
  HA_VERSION: "2026.5.0"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create dummy secrets.yaml
        run: |
          cat > secrets.yaml << 'EOF'
          influxdb_user: dummy
          influxdb_password: dummy
          solax_api_url: "https://dummy.com"
          solax_token: dummy
          solax_sn: dummy
          solax_api_request_body: dummy
          solax_wallbox_sn: dummy
          solax_evc_ip: "192.168.1.1"
          mypv_token: dummy
          mypv_serial: dummy
          tibber_authorization: dummy
          solax_modbus_ip: dummy
          EOF

      - name: Home Assistant Config Check
        uses: home-assistant/actions@latest
        with:
          path: "."

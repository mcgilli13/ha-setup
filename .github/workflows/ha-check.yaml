name: Home Assistant Config Check

env:
  HA_VERSION: "2026.5.0"

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Create secrets.yaml from GitHub Secrets
        run: |
          cat > secrets.yaml << 'EOF'
          influxdb_user: ${{ secrets.INFLUXDB_USER }}
          influxdb_password: ${{ secrets.INFLUXDB_PASSWORD }}
          solax_api_url: "${{ secrets.SOLAX_API_URL }}"
          solax_token: ${{ secrets.SOLAX_TOKEN }}
          solax_sn: ${{ secrets.SOLAX_SN }}
          solax_api_request_body: ${{ secrets.SOLAX_API_REQUEST_BODY }}
          solax_wallbox_sn: ${{ secrets.SOLAX_WALLBOX_SN }}
          mypv_token: ${{ secrets.MYPV_TOKEN }}
          mypv_serial: ${{ secrets.MYPV_SERIAL }}
          tibber_authorization: ${{ secrets.TIBBER_AUTHORIZATION }}
          solax_modbus_ip: ${{ secrets.SOLAX_MODBUS_IP }}
          EOF

      - name: Home Assistant Config Check
        uses: frenck/action-home-assistant@v1
        with:
          path: "."

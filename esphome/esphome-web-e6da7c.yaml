esphome:
  name: esphome-web-e6da7c
  friendly_name: ESPHome_Bluetooth_1
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
- platform: esphome

# Bluetooth Proxy aktivieren
bluetooth_proxy:
  active: true

#wifi:
wifi: !include secrets.yaml

- alias: EV Zwangsladen Start
  id: ev_zwangsladen_start
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.ev_force_charging
    to: 'on'
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.evc_status_code
      state: '0'
    - condition: state
      entity_id: sensor.evc_status_code
      state: '1'
    - condition: state
      entity_id: sensor.evc_status_code
      state: '3'
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.ev_ladestrom
    data:
      value: 16
  - service: modbus.write_register
    data:
      hub: solax_evc
      unit: 1
      address: 1575
      value: 4
- alias: EV Zwangsladen Stop
  id: ev_zwangsladen_stop
  mode: single
  trigger:
  - platform: state
    entity_id: input_boolean.ev_force_charging
    to: 'off'
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.ev_ladestrom
    data:
      value: 16
  - service: modbus.write_register
    data:

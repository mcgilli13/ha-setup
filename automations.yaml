# neue Laderoutine für EV Minimal

- alias: EV Start
  id: ev_start_minimal
  mode: single

  trigger:
    - platform: numeric_state
      entity_id: sensor.ev_ladestrom_optimal
      above: 5.5

    - platform: state
      entity_id: input_boolean.ev_force_charging

  condition:
    - condition: or
      conditions:
        # PV vorhanden
        - condition: template
          value_template: "{{ states('sensor.ev_ladestrom_optimal') | float(0) > 0 }}"
        # Zwangsladen aktiv
        - condition: state
          entity_id: input_boolean.ev_force_charging
          state: "on"

    # Mercedes bereit (0 = idle, 1 = handshaking, 3 = ready)
    - condition: template
      value_template: "{{ states('sensor.evc_status_code') in ['0','1','3'] }}"

    # EV lädt nicht bereits
    - condition: numeric_state
      entity_id: sensor.wb_leistung_w
      below: 50

  action:
    - variables:
        optimal: "{{ states('sensor.ev_ladestrom_optimal') | float(0) }}"
        strom: >
          {% if is_state('input_boolean.ev_force_charging','on') %}
            16
          {% else %}
            {{ optimal }}
          {% endif %}

    # Strom setzen
    - service: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: "{{ strom }}"

    - delay: "00:00:01"

    # Ampere an Wallbox schreiben
    - service: modbus.write_register
      data:
        hub: solax_evc
        unit: 1
        address: 1576
        value: "{{ (strom * 100) | int }}"

    - delay: "00:00:01"

    # Start
    - service: modbus.write_register
      data:
        hub: solax_evc
        unit: 1
        address: 1575
        value: 4

- alias: EV Stop
  id: ev_stop
  mode: single

  trigger:
    - platform: numeric_state
      entity_id: sensor.hausverbrauch_aktuell
      above: 2000   # Netzbezug > 5 kW
      for:
        seconds: 90

  condition:
    - condition: state
      entity_id: sensor.evc_status_code
      state: "2"
    - condition: state
      entity_id: input_boolean.ev_force_charging
      state: "off"

  action:
    - service: modbus.write_register
      data:
        hub: solax_evc
        unit: 1
        address: 1575
        value: 3

    - service: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: 0

- alias: EV Ladestrom Dynamik Komplett
  id: ev_dynamik_komplett
  mode: single

  trigger:
    - platform: time_pattern
      seconds: "/10"

  condition:
    # Auto lädt oder ist startbereit
    - condition: template
      value_template: "{{ states('sensor.evc_status_code') in ['1','2'] }}"

    # 5 Sekunden Sperre nach Status-Änderung
    - condition: template
      value_template: >
        {{ (now() - states.sensor.evc_status_code.last_changed).total_seconds() > 5 }}

  action:
    - variables:
        # Basiswerte
        optimal: "{{ states('sensor.ev_ladestrom_optimal') | float(0) }}"
        aktuell: "{{ states('input_number.ev_ladestrom') | float(0) }}"
        netz: "{{ states('sensor.hausverbrauch_aktuell') | float(0) }}"
        zwang: "{{ is_state('input_boolean.ev_force_charging','on') }}"

        # Grenzen
        min_a: 6
        max_a: 16

        # Schrittweite
        step: 1

        # Berechnung Zielwert
        ziel: >
          {% if zwang %}
            {{ max_a }}
          {% else %}
            {% set z = aktuell %}

            {# --- UPSCALE: PV‑Überschuss --- #}
            {% if netz < -900 %}
              {% set z = z + step %}
            {% endif %}

            {# --- DOWNSCALE: Netzbezug vermeiden --- #}
            {% if netz > 200 %}
              {% set z = z - step %}
            {% endif %}

            {# --- DOWNSCALE nicht unter optimal --- #}
            {% if z < optimal %}
              {% set z = optimal %}
            {% endif %}

            {# --- Grenzen einhalten --- #}
            {% if z < min_a %}
              {{ min_a }}
            {% elif z > max_a %}
              {{ max_a }}
            {% else %}
              {{ z | round(0) }}
            {% endif %}
          {% endif %}


        diff: "{{ (ziel - aktuell) | abs }}"

    # Hysterese 0.5 A
    - condition: template
      value_template: "{{ diff > 0.5 }}"

    # EV Sollwert setzen
    - service: input_number.set_value
      target:
        entity_id: input_number.ev_ladestrom
      data:
        value: "{{ ziel }}"

    # Wallbox schreiben
    - service: modbus.write_register
      data:
        hub: solax_evc
        unit: 1
        address: 1576
        value: "{{ (ziel * 100) | int }}"

- alias: EV Nachtladen Start
  id: ev_nachtladen_start
  trigger:
    - platform: time
      at: "02:00:00"
  condition:
    - condition: state
      entity_id: input_boolean.ev_nachtladen
      state: "on"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.ev_force_charging

- alias: EV Nachtladen Ende
  id: ev_nachtladen_ende
  trigger:
    - platform: time
      at: "06:00:00"
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.ev_force_charging



  id: f241c8dbc70e41e497c416c49c2c8d48
- alias: EV Auto Start bei Solar-Überschuss
  id: ev_auto_start_solar
  mode: single
  trigger:
  - platform: state
    entity_id: sensor.evc_status_code
    to: '0'
    for: 00:00:30
  - platform: numeric_state
    entity_id: sensor.ev_ladestrom_optimal
    above: 5.5
    for: 00:01:00
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: sensor.evc_status_code
      state: '0'
    - condition: state
      entity_id: sensor.evc_status_code
      state: '3'
  - condition: numeric_state
    entity_id: sensor.ev_ladestrom_optimal
    above: 5.5
  - condition: numeric_state
    entity_id: sensor.evc_charging_power
    below: 500
  - condition: state
    entity_id: input_boolean.ev_force_charging
    state: 'off'
  action:
  - service: input_number.set_value
    target:
      entity_id: input_number.ev_ladestrom
    data:
      value: 6
  - service: modbus.write_register
    data:
      hub: solax_evc
      unit: 1
      address: 1576
      value: 600
  - service: modbus.write_register
    data:
      hub: solax_evc
      unit: 1
      address: 1575
      value: 4
  - delay: 00:05:00
  - service: input_number.set_value
    target:
      entity_id: input_number.ev_ladestrom
    data:
      value: '{{ states(''sensor.ev_ladestrom_optimal'') | float(6) }}'
- alias: EV Ladestrom dynamisch anpassen
  id: ev_ladestrom_dynamisch
  mode: single
  trigger:
  - platform: time_pattern
    seconds: /30
  condition:
  - condition: state
    entity_id: sensor.evc_status_code
    state: '2'
  action:
  - variables:
      optimal_strom: '{{ states(''sensor.ev_ladestrom_optimal'') | float(0) }}'
      aktueller_strom: '{{ states(''input_number.ev_ladestrom'') | float(0) }}'
      zwang_aktiv: '{{ is_state(''input_boolean.ev_force_charging'', ''on'') }}'
  - condition: template
    value_template: '{{ (optimal_strom - aktueller_strom) | abs > 0.5 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ optimal_strom == 0 and not zwang_aktiv }}'
      sequence:
      - service: modbus.write_register
        data:
          hub: solax_evc
          unit: 1
          address: 1575
          value: 3
    - conditions:
      - condition: template
        value_template: '{{ optimal_strom > 0 or zwang_aktiv }}'
      sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.ev_ladestrom
        data:
          value: "{% if optimal_strom > 0 %}\n  {{ optimal_strom }}\n{% else %}\n
            \ 16\n{% endif %}\n"

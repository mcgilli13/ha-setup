# modbus:
- name: solax
  type: tcp
  host: !secret solax_modbus_ip
  port: 502
  delay: 2
  message_wait_milliseconds: 250
  timeout: 3
  sensors:
    - name: "SolaX AC Power"
      slave: 1
      address: 1038  # 0x40E
      input_type: input
      data_type: uint16
      scale: 1
      precision: 0
      state_class: measurement
      unit_of_measurement: W
      device_class: power 

    - name: "Solax Inverter Status"
      slave: 1
      address: 1039
      input_type: input
      data_type: uint16

    - name: "SolaX PV String 1"
      slave: 1
      address: 1044  # 0x403
      input_type: input
      data_type: uint16
      unit_of_measurement: W
      device_class: power

    - name: "SolaX PV String 2"
      slave: 1
      address: 1045  # 0x404
      input_type: input
      data_type: uint16
      unit_of_measurement: W
      device_class: power

    - name: "SolaX Yield Total"
      slave: 1
      address: 1059
      input_type: input
      data_type: uint32
      scale: 0.1
      unit_of_measurement: kWh
      precision: 1
      swap: word
      device_class: energy
      state_class: total

    - name: "SolaX Feed-in Power"
      slave: 1
      address: 1083  # 0x43B
      input_type: input
      data_type: int32
      swap: word
      unit_of_measurement: W
      device_class: power

    - name: "SolaX Feed-in Energy"
      slave: 1
      address: 1085  # 0x43D
      input_type: input
      data_type: uint16
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing

    - name: "SolaX Yield Today"
      slave: 1
      address: 1061  # 0x425
      input_type: input
      data_type: uint32
      scale: 0.1
      unit_of_measurement: kWh
      precision: 1
      swap: word
      device_class: energy
      state_class: total

- name: solax_evc
  type: tcp
  host: !secret solax_evc_ip
  port: 502
  delay: 2
  message_wait_milliseconds: 500
  timeout: 5
  scan_interval: 10
  sensors:
    - name: "EVC Charging Power"
      slave: 1
      address: 11
      input_type: input
      data_type: uint16
      scale: 0.001    # -> teilt durch 1000
      precision: 1    # -> z.B. 3.2kW
      unit_of_measurement: kW
      state_class: measurement
    - name: "EVC Status Code"
      slave: 1
      address: 29  # 0x001D
      input_type: input
      data_type: uint16
      unit_of_measurement: code
    - name: "EVC Max Ladestrom"
      slave: 1
      address: 1640  # 0x0668
      input_type: holding
      data_type: uint16
      scale: 0.01
      precision: 2
      unit_of_measurement: "A"
    # Session-Energie (Einzelladung), Einheit 0.1 kWh
    - name: "EVC Session Energy"
      slave: 1
      address: 15         # 0x000F
      input_type: input
      data_type: uint32
      swap: word
      scale: 0.1
      unit_of_measurement: kWh
      device_class: energy
      state_class: total

    # Kumulierte Gesamt-Energie (ideal fürs Energy Dashboard)
    - name: "EVC Total Energy"
      slave: 1
      address: 16         # 0x0010
      input_type: input
      data_type: uint32
      scale: 0.1
      unit_of_measurement: kWh
      device_class: energy
      state_class: total_increasing

  registers:
    - name: "EVC Charging Command"
      slave: 1
      address: 1575
      input_type: holding
      data_type: uint16

    - name: "EVC Charging Current Setpoint"
      slave: 1
      address: 1576
      input_type: holding
      data_type: uint16
